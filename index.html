<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OmniAI Workspace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 避免手機輸入法彈出時畫面異常擠壓 */
    html, body {
      height: 100%;
      height: 100dvh;
      overscroll-behavior-y: none;
    }
    .gemini-input-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col antialiased select-none md:select-auto">

  <!-- 頂部狀態列 -->
  <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-200">
    <div class="flex items-center space-x-2">
      <button id="menu-btn" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600">
        <i data-lucide="menu"></i>
      </button>
      <span class="font-semibold text-lg tracking-wide text-gray-800">Gemini Canvas</span>
      <!-- 網路狀態 -->
      <div id="net-status" class="flex items-center text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-green-500 mr-1.5 animate-pulse"></span>
        <span id="net-text">在線</span>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 重新連線/重新整理鍵 -->
      <button onclick="checkConnection()" title="檢查網路品質" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
      <!-- 設定鍵 -->
      <button onclick="toggleSettingsModal(true)" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- 主對話區域 -->
  <main class="flex-1 overflow-y-auto px-4 py-6 max-w-4xl w-full mx-auto space-y-6" id="chat-stream">
    <div class="flex items-start space-x-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center text-white shrink-0">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
      </div>
      <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm leading-relaxed max-w-[85%]">
        你好！我是你的多領域創作助手。請先點選右上角設定 API Key 與偏好的免費模型，即可無限制開啟深度對話、故事衍生或多媒體規劃。
      </div>
    </div>
  </main>

  <!-- 底部固定操作區（仿 Gemini 浮動卡片） -->
  <footer class="p-4 bg-transparent max-w-4xl w-full mx-auto shrink-0">
    <div class="bg-white rounded-3xl border border-gray-200 p-3 gemini-input-shadow flex flex-col space-y-2">
      
      <!-- 創作衍生與特徵鎖定狀態指示 -->
      <div id="context-anchor-bar" class="hidden items-center justify-between text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl">
        <div class="flex items-center space-x-1 truncate">
          <i data-lucide="pin" class="w-3 h-3 shrink-0"></i>
          <span id="anchor-preview" class="truncate">已鎖定前作特徵</span>
        </div>
        <button onclick="clearAnchor()" class="text-gray-400 hover:text-red-500">
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      </div>

      <!-- 文字輸入與語音區 -->
      <div class="flex items-end space-x-2">
        <textarea 
          id="user-input" 
          rows="1" 
          placeholder="輸入文字、修改思考，或上傳檔案..." 
          class="flex-1 max-h-36 resize-none bg-transparent outline-none p-1 text-gray-800 text-sm leading-6"
          oninput="autoResize(this)"></textarea>
        
        <!-- 檔案匯入 -->
        <label class="cursor-pointer p-2 rounded-full hover:bg-gray-100 text-gray-500 shrink-0">
          <i data-lucide="paperclip" class="w-5 h-5"></i>
          <input type="file" id="file-uploader" class="hidden" onchange="handleFileUpload(event)" multiple accept="image/*,video/*,audio/*,.txt,.pdf,.md" />
        </label>

        <!-- 語音輸入按鍵 -->
        <button id="mic-btn" onclick="toggleSpeechRecognition()" class="p-2 rounded-full hover:bg-gray-100 text-gray-500 shrink-0">
          <i data-lucide="mic" class="w-5 h-5"></i>
        </button>

        <!-- 傳送鍵（嚴格要求點擊才發送） -->
        <button id="send-btn" onclick="sendMessage()" class="p-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white shrink-0">
          <i data-lucide="arrow-up" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 控制標籤列：深度選擇與輔助功能 -->
      <div class="flex items-center justify-between pt-1 border-t border-gray-100 text-xs text-gray-500">
        <div class="flex items-center space-x-2">
          <!-- 領域與深入度模式切換 -->
          <select id="mode-select" class="bg-gray-100 rounded-lg px-2 py-1 outline-none text-gray-700">
            <option value="concise">⚡ 快速重點（精簡字數）</option>
            <option value="in_depth" selected>🔬 深入研究（詳盡論述）</option>
            <option value="storyteller">📖 小說/世界觀創作（豐富情感）</option>
            <option value="coder">💻 代碼與系統架構（精確語法）</option>
          </select>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="exportChat()" title="匯出對話" class="hover:text-gray-800 flex items-center space-x-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">匯出</span>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- 側邊設定面板（彈窗） -->
  <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-gray-800">系統與安全設定</h3>
        <button onclick="toggleSettingsModal(false)" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- API 金鑰配置 -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-gray-600">API Key (儲存於本地沙盒環境)</label>
        <input type="password" id="api-key" placeholder="貼上 OpenRouter / Gemini API Key" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-blue-500" />
      </div>

      <!-- 免費模型庫選擇 -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-gray-600">免費通用模型庫</label>
        <select id="model-select" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
          <option value="google/gemini-2.0-flash-exp:free">Google: Gemini 2.0 Flash (免費/全能/快速)</option>
          <option value="meta-llama/llama-3.3-70b-instruct:free">Meta: Llama 3.3 70B (免費/深度推理)</option>
          <option value="deepseek/deepseek-r1:free">DeepSeek: R1 (免費/邏輯推導)</option>
          <option value="mistralai/mistral-small-24b-instruct-2501:free">Mistral: Small 24B (免費/精準寫作)</option>
        </select>
      </div>

      <!-- 重要記憶點輸入 -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-gray-600">核心長久記憶點 (背景、偏好、約束條件)</label>
        <textarea id="core-memories" rows="3" placeholder="例如：偏好深入研究、具備感性與理性並存的筆調..." class="w-full border rounded-xl p-2 text-sm outline-none focus:border-blue-500"></textarea>
      </div>

      <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition">
        安全儲存配置
      </button>
    </div>
  </div>

  <script>
    // 初始化 Lucide 圖標
    lucide.createIcons();

    // 全域變數
    let chatHistory = [];
    let anchoredContext = ""; // 用於接續創作的鎖定內容
    let recognition = null;
    let isRecording = false;

    // 啟動載入
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      checkConnection();
      initSpeech();
    });

    // 1. 本地設定與安全性
    function loadSettings() {
      const savedKey = localStorage.getItem('omni_ai_key');
      const savedModel = localStorage.getItem('omni_ai_model');
      const savedMem = localStorage.getItem('omni_ai_memories');

      if (savedKey) document.getElementById('api-key').value = atob(savedKey); // 簡易安全編碼儲存
      if (savedModel) document.getElementById('model-select').value = savedModel;
      if (savedMem) document.getElementById('core-memories').value = savedMem;
    }

    function saveSettings() {
      const key = document.getElementById('api-key').value.trim();
      const model = document.getElementById('model-select').value;
      const mem = document.getElementById('core-memories').value.trim();

      if (key) localStorage.setItem('omni_ai_key', btoa(key));
      localStorage.setItem('omni_ai_model', model);
      localStorage.setItem('omni_ai_memories', mem);
      toggleSettingsModal(false);
      alert('設定已安全儲存於本機。');
    }

    function toggleSettingsModal(show) {
      document.getElementById('settings-modal').classList.toggle('hidden', !show);
    }

    // 2. 網路品質檢測
    function checkConnection() {
      const netText = document.getElementById('net-text');
      const netBox = document.getElementById('net-status');
      if (navigator.onLine) {
        netText.textContent = '連線良好';
        netBox.className = 'flex items-center text-xs text-green-600 bg-green-50 px-2 py-0.5 rounded-full';
      } else {
        netText.textContent = '離線中';
        netBox.className = 'flex items-center text-xs text-red-600 bg-red-50 px-2 py-0.5 rounded-full';
      }
    }
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);

    // 3. 語音輸入與語音朗讀 (Web Speech API)
    function initSpeech() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'zh-TW';

        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          document.getElementById('user-input').value = transcript;
          autoResize(document.getElementById('user-input'));
        };

        recognition.onerror = () => toggleSpeechRecognition(false);
      }
    }

    function toggleSpeechRecognition(force) {
      if (!recognition) return alert('目前瀏覽器未支援語音識別');
      const micBtn = document.getElementById('mic-btn');
      if (isRecording || force === false) {
        recognition.stop();
        isRecording = false;
        micBtn.classList.remove('text-red-500', 'animate-pulse');
      } else {
        recognition.start();
        isRecording = true;
        micBtn.classList.add('text-red-500', 'animate-pulse');
      }
    }

    function speakText(text) {
      if (!'speechSynthesis' in window) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 4. 文字框動態高度
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    // 5. 訊息傳送與思考再編輯流程
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const prompt = inputEl.value.trim();
      const apiKey = localStorage.getItem('omni_ai_key') ? atob(localStorage.getItem('omni_ai_key')) : '';

      if (!prompt) return;
      if (!apiKey) {
        alert('請先在設定中輸入 API Key');
        toggleSettingsModal(true);
        return;
      }

      // 渲染使用者訊息（帶編輯按鈕）
      appendMessage('user', prompt);
      inputEl.value = '';
      autoResize(inputEl);

      // 構建 Prompt 與風格要求
      const mode = document.getElementById('mode-select').value;
      const model = localStorage.getItem('omni_ai_model') || 'google/gemini-2.0-flash-exp:free';
      const memory = localStorage.getItem('omni_ai_memories') || '';

      let systemPrompt = `你是一個具備跨領域專業的 AI 助手。核心參考記憶點：${memory}。\n`;
      if (anchoredContext) {
        systemPrompt += `前作特徵（必須在此基礎上衍生，保持鎖定部分不變）：\n${anchoredContext}\n`;
      }

      if (mode === 'concise') {
        systemPrompt += "回覆風格：簡短精確，條列重點，語法簡明扼要。";
      } else if (mode === 'in_depth') {
        systemPrompt += "回覆風格：具備深度學術/研究水準，詳加論述、結構完整、提供多層面洞察。";
      } else if (mode === 'storyteller') {
        systemPrompt += "回覆風格：注重小說世界觀鋪陳、人物心理描繪、富含感性張力與細節衍生。";
      }

      // 呼叫 API
      try {
        const botMsgDiv = appendMessage('bot', '思考中...');
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: "system", content: systemPrompt },
              ...chatHistory.map(m => ({ role: m.role, content: m.text })),
              { role: "user", content: prompt }
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '無法取得有效回覆，請檢查金鑰或網路。';
        
        botMsgDiv.querySelector('.content-body').innerHTML = reply.replace(/\n/g, '<br/>');
        chatHistory.push({ role: 'user', text: prompt }, { role: 'assistant', text: reply });
        
        // 賦予語音朗讀與衍生錨定按鈕
        attachActionButtons(botMsgDiv, reply);

      } catch (err) {
        alert('連線失敗：' + err.message);
      }
    }

    // 渲染對話到畫面上
    function appendMessage(role, text) {
      const stream = document.getElementById('chat-stream');
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end space-x-2' : 'flex items-start space-x-3';

      if (role === 'user') {
        wrapper.innerHTML = `
          <div class="flex flex-col items-end space-y-1 max-w-[85%]">
            <div class="bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-none text-sm leading-relaxed">${text}</div>
            <button onclick="editPrompt('${encodeURIComponent(text)}')" class="text-xs text-gray-400 hover:text-blue-600 flex items-center space-x-1">
              <i data-lucide="edit-3" class="w-3 h-3"></i><span>編輯重發</span>
            </button>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center text-white shrink-0">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-gray-100 shadow-sm leading-relaxed max-w-[85%] space-y-2">
            <div class="content-body text-sm text-gray-800">${text}</div>
            <div class="action-buttons pt-2 border-t border-gray-50 flex items-center space-x-3 text-xs text-gray-400"></div>
          </div>
        `;
      }

      stream.appendChild(wrapper);
      stream.scrollTop = stream.scrollHeight;
      lucide.createIcons();
      return wrapper;
    }

    // 附加朗讀與創作衍生功能
    function attachActionButtons(botMsgDiv, text) {
      const container = botMsgDiv.querySelector('.action-buttons');
      container.innerHTML = `
        <button onclick="speakText('${encodeURIComponent(text)}')" class="hover:text-gray-700 flex items-center space-x-1">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i><span>朗讀</span>
        </button>
        <button onclick="anchorForDerivation('${encodeURIComponent(text)}')" class="hover:text-indigo-600 flex items-center space-x-1">
          <i data-lucide="copy-plus" class="w-3.5 h-3.5"></i><span>鎖定為前作衍生</span>
        </button>
      `;
      lucide.createIcons();
    }

    // 重新編輯輸入
    function editPrompt(encodedText) {
      const text = decodeURIComponent(encodedText);
      const input = document.getElementById('user-input');
      input.value = text;
      input.focus();
      autoResize(input);
    }

    // 鎖定為前作，用於衍生小說、分鏡或腳本
    function anchorForDerivation(encodedText) {
      anchoredContext = decodeURIComponent(encodedText);
      const bar = document.getElementById('context-anchor-bar');
      const preview = document.getElementById('anchor-preview');
      preview.textContent = `鎖定特徵：「${anchoredContext.slice(0, 30)}...」`;
      bar.classList.remove('hidden');
      bar.classList.add('flex');
    }

    function clearAnchor() {
      anchoredContext = "";
      document.getElementById('context-anchor-bar').classList.add('hidden');
    }

    // 6. 檔案匯入與跨平台匯出
    function handleFileUpload(event) {
      const files = event.target.files;
      if (!files.length) return;
      const fileNames = Array.from(files).map(f => f.name).join(', ');
      document.getElementById('user-input').value += `\n[已附加檔案: ${fileNames}]`;
      autoResize(document.getElementById('user-input'));
    }

    function exportChat() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chatHistory, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `OmniAI_Export_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
