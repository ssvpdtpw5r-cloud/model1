<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Gemini Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --keyboard-offset: 0px; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f8fafc;
    }
    #app-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--keyboard-offset);
      transition: padding-bottom 0.1s ease-out;
    }
    .gemini-card-shadow {
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.06);
    }
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      vertical-align: baseline;
      animation: blink 1s infinite;
      color: #3b82f6;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased select-none md:select-auto">

  <!-- 全螢幕開機自檢遮罩 (Pre-flight Diagnosis Modal) -->
  <div id="diagnostic-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="font-bold text-slate-800 text-base">系統環境開機自檢</h2>
          <p class="text-xs text-slate-400">正在執行全方位條件檢驗，通過後解鎖主控台</p>
        </div>
      </div>

      <!-- 測試進度項目清單 -->
      <div class="space-y-2.5 text-xs" id="diagnostic-list">
        <div id="diag-storage" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50">
          <span class="flex items-center space-x-2 text-slate-600">
            <i data-lucide="database" class="w-4 h-4"></i><span>本地儲存與沙盒加密 (localStorage)</span>
          </span>
          <span class="status-badge text-slate-400">檢測中...</span>
        </div>

        <div id="diag-network" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50">
          <span class="flex items-center space-x-2 text-slate-600">
            <i data-lucide="wifi" class="w-4 h-4"></i><span>網路連線狀態與延遲檢測</span>
          </span>
          <span class="status-badge text-slate-400">等待中</span>
        </div>

        <div id="diag-speech" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50">
          <span class="flex items-center space-x-2 text-slate-600">
            <i data-lucide="mic" class="w-4 h-4"></i><span>Web Speech 語音引擎 (語音輸入/朗讀)</span>
          </span>
          <span class="status-badge text-slate-400">等待中</span>
        </div>

        <div id="diag-viewport" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50">
          <span class="flex items-center space-x-2 text-slate-600">
            <i data-lucide="smartphone" class="w-4 h-4"></i><span>行動端虛擬鍵盤防遮蔽引擎</span>
          </span>
          <span class="status-badge text-slate-400">等待中</span>
        </div>

        <div id="diag-file" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50">
          <span class="flex items-center space-x-2 text-slate-600">
            <i data-lucide="file-up" class="w-4 h-4"></i><span>多媒體與檔案讀取沙盒 (FileReader)</span>
          </span>
          <span class="status-badge text-slate-400">等待中</span>
        </div>

        <div id="diag-api" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50">
          <span class="flex items-center space-x-2 text-slate-600">
            <i data-lucide="cpu" class="w-4 h-4"></i><span>Google Gemini 3.6 Flash 端點通訊</span>
          </span>
          <span class="status-badge text-slate-400">等待中</span>
        </div>
      </div>

      <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
        <div id="diag-summary" class="text-xs font-medium text-slate-500">正在初始化自檢程式...</div>
        <button id="diag-action-btn" onclick="startDiagnostics()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-xs transition hidden">
          重新檢驗
        </button>
      </div>
    </div>
  </div>

  <!-- 主對話應用本體 -->
  <div id="app-container">
    <header class="flex items-center justify-between px-4 py-2.5 bg-white border-b border-slate-200 shrink-0">
      <div class="flex items-center space-x-2">
        <span class="font-semibold text-base tracking-tight text-slate-800 flex items-center gap-1.5">
          <i data-lucide="sparkle" class="w-5 h-5 text-blue-600 fill-blue-600"></i> Gemini Canvas
        </span>
        <div id="net-status" class="flex items-center text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
          <span id="net-text">在線正常</span>
        </div>
      </div>
      
      <div class="flex items-center space-x-1">
        <button onclick="startDiagnostics(true)" title="手動執行系統自檢" class="p-2 rounded-full hover:bg-slate-100 text-slate-500">
          <i data-lucide="activity" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleSettingsModal(true)" class="p-2 rounded-full hover:bg-slate-100 text-slate-500">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-4 max-w-3xl w-full mx-auto space-y-5" id="chat-stream">
      <div class="flex items-start space-x-3">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-sm">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200/80 shadow-sm leading-relaxed max-w-[85%] text-sm text-slate-700">
          系統自檢已全部通過！環境運作正常，請直接輸入文字或語音開啟交談。
        </div>
      </div>
    </main>

    <footer class="p-3 max-w-3xl w-full mx-auto shrink-0">
      <div class="bg-white rounded-3xl border border-slate-200 p-2.5 gemini-card-shadow flex flex-col space-y-2">
        
        <div id="context-anchor-bar" class="hidden items-center justify-between text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-xl">
          <div class="flex items-center space-x-1 truncate">
            <i data-lucide="pin" class="w-3 h-3 shrink-0"></i>
            <span id="anchor-preview" class="truncate">鎖定特徵已啟用</span>
          </div>
          <button onclick="clearAnchor()" class="text-slate-400 hover:text-rose-500">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <div class="flex items-end space-x-1.5">
          <textarea 
            id="user-input" 
            rows="1" 
            placeholder="輸入訊息，點箭頭傳送..." 
            class="flex-1 max-h-32 resize-none bg-transparent outline-none px-2 py-1 text-slate-800 text-sm leading-6"
            oninput="autoResize(this)"></textarea>
          
          <label class="cursor-pointer p-2 rounded-full hover:bg-slate-100 text-slate-500 shrink-0">
            <i data-lucide="paperclip" class="w-4 h-4"></i>
            <input type="file" id="file-uploader" class="hidden" onchange="handleFileUpload(event)" multiple />
          </label>

          <button id="mic-btn" onclick="toggleSpeechRecognition()" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 shrink-0">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>

          <button id="send-btn" onclick="sendMessage()" class="p-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white shrink-0 shadow">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center justify-between pt-1 border-t border-slate-100 text-xs">
          <select id="mode-select" class="bg-slate-50 rounded-lg px-2 py-1 outline-none text-slate-600 font-medium">
            <option value="concise">⚡ 快速精簡 (最省流量)</option>
            <option value="in_depth" selected>🔬 深入研究 (結構詳解)</option>
            <option value="storyteller">📖 小說世界觀 (豐富細節)</option>
          </select>
          <button onclick="exportChat()" class="text-slate-400 hover:text-slate-700 flex items-center space-x-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i><span>匯出記錄</span>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- 設定面板 -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800">金鑰與記憶點</h3>
        <button onclick="toggleSettingsModal(false)" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-600">Google Gemini API Key</label>
        <input type="password" id="api-key" placeholder="貼上 AQ... 或 AIza... 金鑰" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500 font-mono" />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-600">全局記憶點 (偏好約束)</label>
        <textarea id="core-memories" rows="2" placeholder="例如：偏好深入探討、理性與感性兼具..." class="w-full border border-slate-200 rounded-xl p-2 text-xs outline-none"></textarea>
      </div>

      <div class="flex space-x-2 pt-1">
        <button onclick="directSaveKey()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-xs transition">
          儲存並重新檢驗
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let chatHistory = [];
    let anchoredContext = "";
    let recognition = null;
    let isRecording = false;

    // --- 自檢診斷核心引擎 (Pre-flight System) ---
    async function startDiagnostics(forceShow = false) {
      const overlay = document.getElementById('diagnostic-overlay');
      const actionBtn = document.getElementById('diag-action-btn');
      const summary = document.getElementById('diag-summary');

      overlay.classList.remove('hidden');
      actionBtn.classList.add('hidden');
      summary.innerText = "診斷程序進行中...";

      let passCount = 0;
      const totalTests = 6;

      // 測試 1: LocalStorage 沙盒讀寫
      await sleep(150);
      try {
        localStorage.setItem('diag_test', 'ok');
        const v = localStorage.getItem('diag_test');
        localStorage.removeItem('diag_test');
        if (v === 'ok') {
          setDiagStatus('diag-storage', true, '正常可用');
          passCount++;
        } else throw new Error();
      } catch (e) {
        setDiagStatus('diag-storage', false, '儲存受限 (無痕模式或被阻擋)');
      }

      // 測試 2: 網路連線與往返延遲
      await sleep(150);
      if (navigator.onLine) {
        const startPing = Date.now();
        try {
          await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
          const pingTime = Date.now() - startPing;
          setDiagStatus('diag-network', true, `良好 (${pingTime} ms)`);
          passCount++;
        } catch(e) {
          setDiagStatus('diag-network', true, '在線 (延遲未知)');
          passCount++;
        }
      } else {
        setDiagStatus('diag-network', false, '設備處於離線狀態');
      }

      // 測試 3: Web Speech API 語音模組
      await sleep(150);
      const hasRecognition = ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window);
      const hasSynthesis = ('speechSynthesis' in window);
      if (hasRecognition && hasSynthesis) {
        setDiagStatus('diag-speech', true, '輸入/朗讀模組均就緒');
        passCount++;
      } else if (hasSynthesis) {
        setDiagStatus('diag-speech', true, '僅支援文字朗讀 (相容)');
        passCount++;
      } else {
        setDiagStatus('diag-speech', false, '瀏覽器不支援語音引擎');
      }

      // 測試 4: 移動端虛擬鍵盤避讓引擎
      await sleep(150);
      if ('visualViewport' in window) {
        setDiagStatus('diag-viewport', true, '動態視窗避讓已就緒');
        passCount++;
      } else {
        setDiagStatus('diag-viewport', true, '使用基礎滾動降級 (可用)');
        passCount++;
      }

      // 測試 5: 多媒體與檔案讀取
      await sleep(150);
      if ('FileReader' in window && 'Blob' in window) {
        setDiagStatus('diag-file', true, '檔案系統相容');
        passCount++;
      } else {
        setDiagStatus('diag-file', false, '不支援本機檔案讀取');
      }

      // 測試 6: Google Gemini 3.6 Flash 連通度
      await sleep(200);
      const rawKey = localStorage.getItem('omni_ai_key');
      if (!rawKey) {
        setDiagStatus('diag-api', false, '未設定金鑰 (請至設定填入)');
      } else {
        const key = atob(rawKey).trim();
        try {
          // 向 Google 端點發送極小 Token 握手測試
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(key)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "ping" }] }] })
          });

          if (res.ok) {
            setDiagStatus('diag-api', true, 'Google 官方端點通訊暢通');
            passCount++;
          } else {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData.error?.message || `HTTP ${res.status}`;
            if (res.status === 503) {
              setDiagStatus('diag-api', true, '端點已連通 (目前尖峰塞車，已啟用備援)');
              passCount++;
            } else {
              setDiagStatus('diag-api', false, `金鑰或權限異常: ${errMsg}`);
            }
          }
        } catch (e) {
          setDiagStatus('diag-api', false, '連線超時或受到安全防護阻擋');
        }
      }

      // 總結判定
      if (passCount >= 5) {
        summary.innerHTML = `<span class="text-emerald-600 font-semibold">自檢通過 (${passCount}/${totalTests})，即將進入工作台...</span>`;
        setTimeout(() => {
          overlay.classList.add('hidden');
        }, 900);
      } else {
        summary.innerHTML = `<span class="text-rose-600 font-semibold">自檢未完全通過 (${passCount}/${totalTests})，請排查紅字項目。</span>`;
        actionBtn.classList.remove('hidden');
        if (!rawKey) {
          toggleSettingsModal(true);
        }
      }
    }

    function setDiagStatus(elemId, success, text) {
      const row = document.getElementById(elemId);
      const badge = row.querySelector('.status-badge');
      badge.innerText = text;
      badge.className = success 
        ? "status-badge text-[11px] font-medium text-emerald-600 flex items-center gap-1"
        : "status-badge text-[11px] font-medium text-rose-600 flex items-center gap-1";
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // --- 介面適配與基礎工具 ---
    function setupViewportAdjustment() {
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          const offset = window.innerHeight - window.visualViewport.height;
          document.documentElement.style.setProperty('--keyboard-offset', `${Math.max(0, offset)}px`);
          scrollChatToBottom();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupViewportAdjustment();
      loadSettings();
      checkConnection();
      initSpeech();
      // 開機自動自檢
      startDiagnostics();
    });

    function scrollChatToBottom() {
      const stream = document.getElementById('chat-stream');
      stream.scrollTop = stream.scrollHeight;
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function loadSettings() {
      const savedKey = localStorage.getItem('omni_ai_key');
      const savedMem = localStorage.getItem('omni_ai_memories');
      if (savedKey) {
        try { document.getElementById('api-key').value = atob(savedKey).trim(); } catch(e) {}
      }
      if (savedMem) document.getElementById('core-memories').value = savedMem;
    }

    function directSaveKey() {
      const key = document.getElementById('api-key').value.trim();
      if (!key) return alert('請先輸入金鑰');
      localStorage.setItem('omni_ai_key', btoa(key));
      localStorage.setItem('omni_ai_memories', document.getElementById('core-memories').value.trim());
      toggleSettingsModal(false);
      startDiagnostics(true); // 重新跑一次診斷
    }

    function toggleSettingsModal(show) {
      document.getElementById('settings-modal').classList.toggle('hidden', !show);
    }

    function checkConnection() {
      const netText = document.getElementById('net-text');
      const netBox = document.getElementById('net-status');
      if (navigator.onLine) {
        netText.textContent = '在線正常';
        netBox.className = 'flex items-center text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full';
      } else {
        netText.textContent = '離線中';
        netBox.className = 'flex items-center text-xs text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full';
      }
    }
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);

    // --- 訊息發送流程 (支援備援與重試) ---
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const prompt = inputEl.value.trim();
      const rawKey = localStorage.getItem('omni_ai_key');
      const apiKey = rawKey ? atob(rawKey).trim() : '';

      if (!prompt) return;
      if (!apiKey) {
        alert('請先在設定中填入 API Key');
        toggleSettingsModal(true);
        return;
      }

      appendMessage('user', prompt);
      inputEl.value = '';
      autoResize(inputEl);

      const mode = document.getElementById('mode-select').value;
      const memory = localStorage.getItem('omni_ai_memories') || '';

      let systemPrompt = `助手偏好：${memory}。`;
      if (anchoredContext) systemPrompt += `\n[保留原特徵]: ${anchoredContext}`;
      if (mode === 'concise') systemPrompt += "\n限制: 極簡答覆，條列重點。";
      else if (mode === 'in_depth') systemPrompt += "\n風格: 深入探討、理性分析與感性筆調兼具、層次分明。";
      else if (mode === 'storyteller') systemPrompt += "\n風格: 小說敘事，情感充沛。";

      const botCard = appendMessage('bot', '');
      const contentEl = botCard.querySelector('.content-body');
      contentEl.classList.add('typing-cursor');

      const candidateModels = ["gemini-3.6-flash", "gemini-2.5-flash", "gemini-2.0-flash"];
      let fullReply = "";
      let success = false;
      let lastErrorMessage = "";

      const payload = {
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: [
          ...chatHistory.slice(-4).map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.text }]
          })),
          { role: "user", parts: [{ text: prompt }] }
        ]
      };

      try {
        for (const model of candidateModels) {
          for (let attempt = 0; attempt < 2; attempt++) {
            if (attempt > 0) {
              contentEl.innerHTML = `<span class="text-blue-500 text-xs">伺服器繁忙，正在自動避讓重試...</span>`;
              await sleep(1500);
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              const data = await res.json();
              fullReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "無回覆內容。";
              success = true;
              break;
            } else {
              const errData = await res.json().catch(() => ({}));
              lastErrorMessage = errData.error?.message || `HTTP ${res.status}`;
              if (res.status !== 503 && res.status !== 429) break;
            }
          }
          if (success) break;
        }

        if (!success) throw new Error(lastErrorMessage);

        contentEl.classList.remove('typing-cursor');
        contentEl.innerHTML = fullReply.replace(/\n/g, '<br/>');
        chatHistory.push({ role: 'user', text: prompt }, { role: 'assistant', text: fullReply });
        attachActionButtons(botCard, fullReply);
        scrollChatToBottom();

      } catch (err) {
        contentEl.classList.remove('typing-cursor');
        contentEl.innerHTML = `<span class="text-rose-500 font-medium">請求未完成：${err.message}</span>`;
      }
    }

    function appendMessage(role, text) {
      const stream = document.getElementById('chat-stream');
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end' : 'flex items-start space-x-3';

      if (role === 'user') {
        wrapper.innerHTML = `
          <div class="flex flex-col items-end space-y-1 max-w-[85%]">
            <div class="bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-none text-sm leading-relaxed">${text}</div>
            <button onclick="editPrompt('${encodeURIComponent(text)}')" class="text-xs text-slate-400 hover:text-blue-600 flex items-center space-x-1">
              <i data-lucide="edit-3" class="w-3 h-3"></i><span>編輯重發</span>
            </button>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-sm">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200/80 shadow-sm leading-relaxed max-w-[85%] space-y-2">
            <div class="content-body text-sm text-slate-700">${text}</div>
            <div class="action-buttons pt-2 border-t border-slate-50 flex items-center space-x-3 text-xs text-slate-400"></div>
          </div>
        `;
      }

      stream.appendChild(wrapper);
      scrollChatToBottom();
      lucide.createIcons();
      return wrapper;
    }

    function editPrompt(encodedText) {
      const text = decodeURIComponent(encodedText);
      const input = document.getElementById('user-input');
      input.value = text;
      input.focus();
      autoResize(input);
    }

    function attachActionButtons(botMsgDiv, text) {
      const container = botMsgDiv.querySelector('.action-buttons');
      container.innerHTML = `
        <button onclick="speakText('${encodeURIComponent(text)}')" class="hover:text-slate-700 flex items-center space-x-1">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i><span>朗讀</span>
        </button>
        <button onclick="anchorForDerivation('${encodeURIComponent(text)}')" class="hover:text-indigo-600 flex items-center space-x-1">
          <i data-lucide="copy-plus" class="w-3.5 h-3.5"></i><span>鎖定為前作衍生</span>
        </button>
      `;
      lucide.createIcons();
    }

    function anchorForDerivation(encodedText) {
      anchoredContext = decodeURIComponent(encodedText);
      const bar = document.getElementById('context-anchor-bar');
      const preview = document.getElementById('anchor-preview');
      preview.textContent = `鎖定前作：${anchoredContext.slice(0, 24)}...`;
      bar.classList.remove('hidden');
      bar.classList.add('flex');
    }

    function clearAnchor() {
      anchoredContext = "";
      document.getElementById('context-anchor-bar').classList.add('hidden');
    }

    function initSpeech() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.lang = 'zh-TW';
        recognition.onresult = (e) => {
          document.getElementById('user-input').value = e.results[0][0].transcript;
          autoResize(document.getElementById('user-input'));
          toggleSpeechRecognition(false);
        };
        recognition.onerror = () => toggleSpeechRecognition(false);
      }
    }

    function toggleSpeechRecognition(force) {
      if (!recognition) return alert('瀏覽器不支援語音辨識');
      const btn = document.getElementById('mic-btn');
      if (isRecording || force === false) {
        recognition.stop();
        isRecording = false;
        btn.classList.remove('text-rose-500', 'animate-pulse');
      } else {
        recognition.start();
        isRecording = true;
        btn.classList.add('text-rose-500', 'animate-pulse');
      }
    }

    function speakText(text) {
      if (!'speechSynthesis' in window) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(decodeURIComponent(text));
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    function handleFileUpload(e) {
      const files = e.target.files;
      if (!files.length) return;
      document.getElementById('user-input').value += `\n[附加檔案: ${Array.from(files).map(f => f.name).join(', ')}]`;
      autoResize(document.getElementById('user-input'));
    }

    function exportChat() {
      const blob = new Blob([JSON.stringify(chatHistory, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Gemini_Chat_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
