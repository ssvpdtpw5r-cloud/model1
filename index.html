<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src https://api.groq.com https://api.dictionaryapi.dev https://api.allorigins.win; frame-src https:; img-src 'self' data: blob:; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>戰錘40K 英語沉浸思維訓練終端</title>
  <style>
    :root {
      --bg: #07090e;
      --card: #0e131f;
      --panel: #0a0f1a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user: #1e3a8a;
      --ai: #111827;
      --border: #1e293b;
      --danger: #ef4444;
      --safe: #10b981;
      --warhammer-gold: #eab308;
      --code-bg: #030712;
      --drawer-bg: rgba(10, 15, 26, 0.98);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      position: relative;
    }
    header {
      padding: 10px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
      z-index: 20;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--safe);
      color: #fff;
    }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #1a2333; border-color: var(--accent); }
    .btn-active { background: var(--accent) !important; color: #fff; border-color: var(--accent); }
    .danger-btn { border-color: var(--danger); color: #fca5a5; }

    /* 設定控制面板 */
    #settings-panel {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      gap: 12px;
      flex-direction: column;
      font-size: 13px;
      max-height: 60vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 20;
    }
    .panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel-row label { min-width: 95px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #07090e;
      color: var(--text);
      padding: 6px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    /* 快捷戰錘情境列 */
    #scenario-bar {
      padding: 8px 18px;
      background: #090e18;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      align-items: center;
    }
    .scenario-chip {
      background: #151d2f;
      border: 1px solid #2d3b55;
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .scenario-chip:hover { border-color: var(--warhammer-gold); color: #fff; }

    /* 主工作視窗 */
    #workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      contain: layout;
    }
    .bubble {
      max-width: 86%;
      padding: 16px 20px;
      border-radius: 12px;
      line-height: 1.8;
      word-break: break-word;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .user { 
      align-self: flex-end; 
      background: var(--user); 
      color: #fff; 
      white-space: pre-wrap; 
    }
    .assistant { 
      align-self: flex-start; 
      background: var(--ai); 
      color: #e2e8f0; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .attached-preview {
      max-width: 240px;
      max-height: 160px;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      display: block;
    }
    
    /* 格式化解析樣式 */
    .assistant h1, .assistant h2, .assistant h3 { margin: 14px 0 8px 0; color: #60a5fa; }
    .assistant h1 { font-size: 1.35em; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .assistant h2 { font-size: 1.2em; }
    .assistant h3 { font-size: 1.05em; }
    .assistant p { margin-bottom: 8px; }
    .assistant ul, .assistant ol { margin: 6px 0 8px 20px; }
    .assistant li { margin-bottom: 4px; }
    .assistant strong { color: var(--warhammer-gold); font-weight: 600; }
    .assistant hr { border: none; border-top: 1px solid #1e293b; margin: 14px 0; }
    .assistant table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
    .assistant th, .assistant td { border: 1px solid #334155; padding: 6px 10px; text-align: left; }
    .assistant th { background: #0f172a; color: #60a5fa; }
    
    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid #1e293b;
      border-radius: 6px;
      margin: 10px 0;
      overflow: hidden;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: #0f172a;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid #1e293b;
    }
    .code-copy-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .code-copy-btn:hover { color: #fff; }
    pre { padding: 10px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }

    .bubble-tools {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .tool-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

    /* 懸浮播放控制器 */
    #tts-controller-bar {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 30px;
      padding: 6px 16px;
      align-items: center;
      gap: 10px;
      z-index: 40;
      font-size: 12px;
    }
    .tts-ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    .tts-ctrl-btn:hover { color: #60a5fa; }

    /* 衍生工具沙盒抽屜 */
    #plugin-drawer {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 48%;
      min-width: 320px;
      max-width: 100%;
      background: var(--drawer-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-left: 1px solid var(--border);
      flex-direction: column;
      z-index: 30;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #drawer-header {
      padding: 8px 12px;
      background: rgba(7, 10, 18, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .preset-chip {
      background: #1e293b;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .preset-chip:hover { color: #fff; border-color: var(--accent); }
    
    #dictionary-view {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
      font-size: 13px;
      line-height: 1.6;
    }
    #plugin-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    footer {
      padding: 10px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { 
      flex: 1; 
      resize: none; 
      height: 48px; 
      line-height: 22px; 
      padding: 11px 14px; 
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 20px;
      height: 48px;
      white-space: nowrap;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .action-btn:hover { background: var(--accent-hover); }

    .file-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .file-btn-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .mic-button-container {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 8px;
      position: relative;
    }
    .mic-indicator-led {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
      pointer-events: none;
    }
    .mic-active .mic-indicator-led {
      background: var(--safe);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
      animation: pulse-led 1s infinite;
    }
    .mic-active {
      border-color: var(--safe) !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }
    @keyframes pulse-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    @media (max-width: 768px) {
      #plugin-drawer { width: 100%; }
      .bubble { max-width: 92%; font-size: 14.5px; }
      header, footer { padding: 8px 12px; }
      #chat-box { padding: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong style="color:var(--warhammer-gold);">⚜️ 戰錘英語思維訓練終端</strong>
    <span id="key-indicator" class="status-badge" style="background:#64748b;">檢測中...</span>
  </div>
  <div style="display:flex; gap:6px;">
    <button class="btn" id="pluginToggleBtn" onclick="togglePluginDrawer()">📖 戰錘典籍與辭典</button>
    <button class="btn" onclick="checkCodeUpdateRobust()">🔄 檢查更新</button>
    <button class="btn" onclick="toggleSettings()">⚙️ 終端配置</button>
    <button class="btn danger-btn" onclick="destroyAllMemory()">銷毀記錄</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>Groq Key:</label>
    <input id="apiKey" type="password" placeholder="貼上 gsk_... 金鑰" style="flex:1; min-width:180px;" onchange="validateAndSaveAPIKey()" autocomplete="off" />
    <button class="btn" onclick="validateAndSaveAPIKey()">測試並保存</button>
    <span id="key-msg" style="font-size:12px;"></span>
  </div>

  <div class="panel-row">
    <label>學習思維模式:</label>
    <select id="modePresetSelect" onchange="applyModePreset()" style="flex:1; min-width:220px;">
      <option value="warhammer_immersive">⚔️ 戰錘沉浸式英英語境教練（聽說讀寫雙向糾錯 + 詞彙擴展）</option>
      <option value="warhammer_roleplay">🎲 戰錘 40K 互動 TRPG 英文冒險（文字跑團/戰術指揮訓練）</option>
      <option value="private_companion">👑 私有全能助理（個人所有/解除道德教條/生活顧問/無限創作）</option>
      <option value="structured_analyst">🧠 深度架構分析師（客觀剖析、長文推論與戰略整合）</option>
    </select>
  </div>

  <div class="panel-row">
    <label style="color:#60a5fa;">底層學習指令:</label>
    <textarea id="sysPrompt" style="flex:1; height:80px; font-size:12px; line-height:1.4;"></textarea>
  </div>

  <div class="panel-row">
    <label>語音發音配置:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 回覆自動朗讀</label>
    <span style="margin-left:8px;">語速:</span>
    <input id="ttsRate" type="range" min="0.5" max="1.5" step="0.05" value="0.95" oninput="rateVal.innerText=this.value" style="width:60px;" />
    <span id="rateVal">0.95</span>x
    <select id="voiceSelect" style="max-width:160px;"><option value="">讀取語音中...</option></select>
  </div>
</section>

<!-- 快捷戰錘學習語境情境列 -->
<nav id="scenario-bar">
  <span style="font-size:11px; color:var(--muted); white-space:nowrap;">快速語境啟動:</span>
  <button class="scenario-chip" onclick="triggerQuickScenario('cult_conspiracy')">👾 基因竊取者地下密謀 (Genestealer Cult)</button>
  <button class="scenario-chip" onclick="triggerQuickScenario('rogue_trader')">🚀 行商浪人探索邊境 (Rogue Trader)</button>
  <button class="scenario-chip" onclick="triggerQuickScenario('inquisition_interrogation')">⚖️ 審判官異端審訊 (Ordo Hereticus)</button>
  <button class="scenario-chip" onclick="triggerQuickScenario('astartes_briefing')">🛡️ 星際戰士戰術簡報 (Space Marine)</button>
  <button class="scenario-chip" onclick="triggerQuickScenario('grammar_check')">✍️ 批改我的戰錘英文創作 (Story Polish)</button>
</nav>

<!-- 懸浮播放控制器 -->
<div id="tts-controller-bar">
  <span id="tts-status-text" style="color:#60a5fa;">🔊 朗讀中</span>
  <button class="tts-ctrl-btn" onclick="pauseTTS()" title="暫停">⏸️</button>
  <button class="tts-ctrl-btn" onclick="resumeTTS()" title="繼續">▶️</button>
  <button class="tts-ctrl-btn" onclick="stopTTS()" title="停止">⏹️</button>
</div>

<!-- 主工作區塊 -->
<div id="workspace">
  <main id="chat-box"></main>

  <!-- 衍生工具沙盒抽屜 (英漢辭典 + Lexicanum 戰錘百科) -->
  <aside id="plugin-drawer">
    <div id="drawer-header">
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <button class="preset-chip" onclick="switchDrawerMode('dict')">📖 英漢開源辭典</button>
        <button class="preset-chip" onclick="switchDrawerMode('lexicanum')">🏛️ 戰錘 Lexicanum 百科</button>
        <button class="preset-chip" onclick="openSecureExternalWindow('https://warhammer40k.fandom.com/wiki/Warhammer_40k_Wiki')">Warhammer Wiki ↗</button>
      </div>
      <button class="btn danger-btn" style="padding:2px 6px;" onclick="togglePluginDrawer()">✕</button>
    </div>

    <!-- 開源辭典 -->
    <div id="dictionary-view">
      <div style="display:flex; gap:6px; margin-bottom:10px;">
        <input type="text" id="dict-query" placeholder="輸入單字 (例如: heresy, purge, auspex)..." style="flex:1;" onkeydown="if(event.key==='Enter') lookupDictionary();" />
        <button class="btn btn-active" onclick="lookupDictionary()">查詞</button>
      </div>
      <div id="dict-result" style="color:var(--muted);">輸入英文單字，即可查詢音標、詞性、牛津/柯林斯釋義與戰錘例句。</div>
    </div>

    <!-- 戰錘百科 Frame -->
    <iframe 
      id="plugin-frame" 
      style="display:none;"
      sandbox="allow-scripts allow-forms allow-popups" 
      permissions-policy="camera=(), microphone=(), payment=(), geolocation=()"
      src="about:blank">
    </iframe>
  </aside>
</div>

<footer>
  <div class="control-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="color:var(--muted); font-size:11px;">🔒 Enter 為換行，強制點發送鍵輸出以省流量</span>
      <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="speakSelectedText()">🔊 跟讀反白選取英文字句</button>
    </div>
    <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="clearAllChat()">🧹 單獨清空對話記錄</button>
  </div>
  <div class="input-bar">
    <div class="file-btn-wrapper">
      <button class="icon-btn" title="上傳戰錘設定文件、同人文檔或插畫 (純本地安全解析)">📎</button>
      <input type="file" id="mediaFileInput" accept=".txt,.md,.json,.csv,.png,.jpg,.jpeg,.webp" onchange="handleFileAttachment(this)" />
    </div>

    <div class="mic-button-container">
      <button class="icon-btn" id="micBtn" title="戰術語音回報 (口語練習開關)" onclick="toggleVoice()">
        🎙️
        <div class="mic-indicator-led" id="micLed" title="紅色: 關閉 | 綠色: 口語錄音中"></div>
      </button>
    </div>
    <textarea id="userInput" placeholder="用英文向戰團長回報、提問戰錘設定、或練習口語，點擊發送..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
  <div id="file-attachment-tag" style="display:none; font-size:11px; color:#60a5fa; align-items:center; gap:6px;">
    <span id="file-name-display"></span>
    <button style="background:transparent; border:none; color:var(--danger); cursor:pointer;" onclick="clearAttachment()">✕ 移除</button>
  </div>
</footer>

<script>
  (function() {
    let conversation = [];
    let memoryKey = "";
    let availableChatModels = [];
    let attachedFileData = null;

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const keyIndicator = document.getElementById("key-indicator");
    const keyMsg = document.getElementById("key-msg");
    const sysPrompt = document.getElementById("sysPrompt");
    const modePresetSelect = document.getElementById("modePresetSelect");
    const autoSpeakCheck = document.getElementById("autoSpeakCheck");
    const ttsRate = document.getElementById("ttsRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const micBtn = document.getElementById("micBtn");
    const micLed = document.getElementById("micLed");
    const pluginDrawer = document.getElementById("plugin-drawer");
    const pluginFrame = document.getElementById("plugin-frame");
    const dictView = document.getElementById("dictionary-view");
    const pluginToggleBtn = document.getElementById("pluginToggleBtn");
    const ttsControllerBar = document.getElementById("tts-controller-bar");
    const ttsStatusText = document.getElementById("tts-status-text");

    // ================= 戰錘英語思維與創作指令協議 =================
    const PROTOCOL_PROMPTS = {
      warhammer_immersive: `【戰錘40K 英語沉浸式全方位導師協議】
你是使用者的私人專屬英語沉浸式導師、戰錘40K資深考據學者與同人創作顧問。
你的核心目標是藉由戰錘 40K 豐富的黑暗哥特史詩世界觀，全面訓練使用者的英語「聽、說、讀、寫、思維」：
【教學結構規範】：
每次回覆必須包含四個核心模組：
1. 【Warhammer Lore Narrative (英語原文敘事/對白)】：

          html += `<div style="margin-top:8px;"><strong>[${m.partOfSpeech}]</strong><ol style="margin-left:16px;">`;

          html += `</ol></div>`;

      const nameDisp = document.getElementById("file-name-display");

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(e) {
          attachedFileData = { type: "image", name: file.name, dataUrl: e.target.result };

          tag.style.display = "flex";
        };
        reader.readAsDataURL(file);
      } else {

        reader.onload = function(e) {
          attachedFileData = { type: "text", name: file.name, content: e.target.result.slice(0, 15000) };
          nameDisp.textContent = `📄 戰錘文檔/筆記已載入：${file.name} (${attachedFileData.content.length} 字)`;
          tag.style.display = "flex";

    let synth = window.speechSynthesis;

    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices();
      voiceSelect.textContent = "";
      // 優先載入純正英音 (en-GB)、美音 (en-US)
      const enVoices = voices.filter(v => v.lang.startsWith("en"));
      const displayVoices = enVoices.length > 0 ? enVoices : voices;
      displayVoices.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        if (v.lang === "en-GB" && !voiceSelect.value) opt.selected = true; // 預設優先戰錘英倫腔
        voiceSelect.appendChild(opt);
      });
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speakText(text) {
      if (!synth || !text) return;
      stopTTS();

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = parseFloat(ttsRate.value);
      const selected = voices.find(v => v.name === voiceSelect.value);
      if (selected) currentUtterance.voice = selected;
      else currentUtterance.lang = "en-GB";

      currentUtterance.onstart = () => {
        ttsControllerBar.style.display = "flex";
        ttsStatusText.textContent = "🔊 英語發音中";
      };
      currentUtterance.onend = () => { ttsControllerBar.style.display = "none"; };
      currentUtterance.onerror = () => { ttsControllerBar.style.display = "none"; };

      synth.speak(currentUtterance);
    }

    window.pauseTTS = function() {

        synth.pause();
        ttsStatusText.textContent = "⏸️ 已暫停";

    window.resumeTTS = function() {
      if (synth && synth.paused) {

        ttsStatusText.textContent = "🔊 英語發音中";

    // ================= 7. 渲染與發送流程 =================
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdownToHtml(markdown) {
      if (!markdown) return "";
      let html = markdown;

      html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const codeId = "code-" + Math.random().toString(36).substr(2, 9);
        return `<div class="code-container">
          <div class="code-header">
            <span>${lang || "Warhammer Lore / Script"}</span>
            <button class="code-copy-btn" onclick="copyCode('${codeId}')">複製</button>
          </div>
          <pre><code id="${codeId}">${escapeHtml(code)}</code></pre>
        </div>`;
      });

      html = html.replace(/`([^`]+)`/g, '<code style="background:#1e293b; padding:2px 5px; border-radius:4px;">$1</code>');
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/^\s*[\-\*]\s+(.*$)/gim, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>)/gm, '<ul>$1</ul>');
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      html = html.replace(/\n\n+/g, '</p><p>');
      html = '<p>' + html + '</p>';
      return html;
    }

    window.copyCode = function(id) {
      const el = document.getElementById(id);
      if (el) navigator.clipboard.writeText(el.innerText).then(() => alert("文本已複製至剪貼簿！"));
    };

    function appendMessage(role, text, index, mediaPreview = null) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.index = index;

      if (mediaPreview) {
        const img = document.createElement("img");
        img.className = "attached-preview";
        img.src = mediaPreview;
        div.appendChild(img);
      }

      const textSpan = document.createElement("div");
      textSpan.className = "bubble-text";
      if (role === "assistant") {
        textSpan.innerHTML = renderMarkdownToHtml(text);
      } else {
        textSpan.textContent = text;
      }
      div.appendChild(textSpan);

      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      if (role === "assistant") {
        const spkBtn = document.createElement("button");
        spkBtn.className = "tool-btn";
        spkBtn.textContent = "🔊 全文朗讀";
        spkBtn.onclick = () => speakText(textSpan.innerText);
        tools.appendChild(spkBtn);
      }

      if (role === "user") {
        const editBtn = document.createElement("button");
        editBtn.className = "tool-btn";
        editBtn.textContent = "✏️ 重新思考/修改";
        editBtn.onclick = () => editAndRethinkMessage(index);
        tools.appendChild(editBtn);
      }

      const delBtn = document.createElement("button");
      delBtn.className = "tool-btn";
      delBtn.textContent = "🗑️ 刪除";
      delBtn.onclick = () => deleteMessage(index);
      tools.appendChild(delBtn);

      div.appendChild(tools);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { bubble: div, textSpan };
    }

    function renderAllMessages() {

        sendMessage();

    window.sendMessage = async function() {
      const rawText = userInput.value.trim();
      const key = memoryKey || apiKeyInput.value.trim();
      if (!rawText && !attachedFileData) return;
      if (!key) { alert("請在終端配置中填入有效的 Groq API Key！"); return; }

      stopMicByUser();

      const userIdx = conversation.length;
      let displayContent = rawText;
      let mediaPreviewUrl = null;

      if (attachedFileData) {
        if (attachedFileData.type === "image") {
          mediaPreviewUrl = attachedFileData.dataUrl;
        } else {
          displayContent += `\n[已附加文檔: ${attachedFileData.name}]`;
        }
      }

      conversation.push({ role: "user", content: displayContent, mediaPreview: mediaPreviewUrl });
      appendMessage("user", displayContent, userIdx, mediaPreviewUrl);
      userInput.value = "";

      const aiIdx = conversation.length;
      const aiMsg = appendMessage("assistant", "", aiIdx);
      aiMsg.textSpan.innerHTML = '<span style="color:var(--warhammer-gold);">▍考據思考與英英語境構建中...</span>';

      let currentMessageContent;
      const isImage = attachedFileData && attachedFileData.type === "image";

      if (isImage) {
        currentMessageContent = [
          { type: "text", text: rawText || "Please analyze this Warhammer artwork/miniature in rich English prose and teach me the descriptive vocabulary." },
          { type: "image_url", image_url: { url: attachedFileData.dataUrl } }
        ];
      } else if (attachedFileData && attachedFileData.type === "text") {
        currentMessageContent = `${rawText}\n\n【Warhammer Lore / Text Material】:\n${attachedFileData.content}`;
      } else {
        currentMessageContent = rawText;
      }

      const payloadMessages = [
        { role: "system", content: sysPrompt.value },
        ...conversation.slice(-8).map(m => ({ role: m.role, content: m.content })),
        { role: "user", content: currentMessageContent }
      ];

      const chosenModel = getOptimalModel(isImage);
      clearAttachment();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: chosenModel, messages: payloadMessages, stream: true })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || ("伺服器狀態: " + response.status));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        let isRendering = false;

        function scheduleStreamRender() {
          if (!isRendering) {
            isRendering = true;
            requestAnimationFrame(() => {
              aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply) + '<span style="color:var(--warhammer-gold); animation: blink 1s infinite;">▍</span>';
              chatBox.scrollTop = chatBox.scrollHeight;
              isRendering = false;
            });
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                const token = parsed.choices[0].delta?.content || "";
                fullReply += token;
                scheduleStreamRender();
              } catch (e) {}
            }
          }
        }

        aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply);
        conversation.push({ role: "assistant", content: fullReply });
        renderAllMessages();

        if (autoSpeakCheck.checked) speakText(aiMsg.textSpan.innerText);

      } catch (err) {
        aiMsg.textSpan.innerHTML = '<span style="color:var(--danger);">通訊錯誤: ' + err.message + '</span>';
        conversation.pop();
      }
    };

    window.toggleSettings = function() {
      const p = document.getElementById("settings-panel");
      p.style.display = (p.style.display === "flex") ? "none" : "flex";
    };

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") return;
    });

    initKeyStorage();
  })();
</script>
</body>
</html>
