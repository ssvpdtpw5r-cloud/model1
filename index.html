<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src https://api.groq.com https://api.dictionaryapi.dev; frame-src https:; img-src 'self' data: blob:; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>戰錘40K 英語同人互動學習終端</title>
  <style>
    :root {
      --bg: #07090e;
      --card: #0e131f;
      --panel: #0a0f1a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user: #1e3a8a;
      --ai: #111827;
      --border: #1e293b;
      --danger: #ef4444;
      --safe: #10b981;
      --warhammer-gold: #eab308;
      --code-bg: #030712;
      --drawer-bg: rgba(10, 15, 26, 0.98);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      position: relative;
    }
    header {
      padding: 10px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
      z-index: 20;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--safe);
      color: #fff;
    }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #1a2333; border-color: var(--accent); }
    .btn-active { background: var(--accent) !important; color: #fff; border-color: var(--accent); }
    .gold-btn { border-color: var(--warhammer-gold); color: var(--warhammer-gold); }
    .gold-btn:hover { background: rgba(234, 179, 8, 0.15); }
    .danger-btn { border-color: var(--danger); color: #fca5a5; }

    #settings-panel {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      gap: 12px;
      flex-direction: column;
      font-size: 13px;
      max-height: 60vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 20;
    }
    .panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel-row label { min-width: 95px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #07090e;
      color: var(--text);
      padding: 6px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    /* 同人作品與情境引導列 */
    #scenario-bar {
      padding: 8px 18px;
      background: #090e18;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      align-items: center;
    }
    .scenario-chip {
      background: #151d2f;
      border: 1px solid #2d3b55;
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .scenario-chip:hover { border-color: var(--warhammer-gold); color: #fff; }
    .active-novel-chip { border-color: var(--warhammer-gold) !important; color: #fff !important; background: #262112 !important; }

    #workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      contain: layout;
    }
    .bubble {
      max-width: 86%;
      padding: 16px 20px;
      border-radius: 12px;
      line-height: 1.8;
      word-break: break-word;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .user { 
      align-self: flex-end; 
      background: var(--user); 
      color: #fff; 
      white-space: pre-wrap; 
    }
    .assistant { 
      align-self: flex-start; 
      background: var(--ai); 
      color: #e2e8f0; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .assistant h1, .assistant h2, .assistant h3 { margin: 14px 0 8px 0; color: #60a5fa; }
    .assistant h1 { font-size: 1.35em; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .assistant p { margin-bottom: 8px; }
    .assistant strong { color: var(--warhammer-gold); font-weight: 600; }
    
    /* 互動填空樣式 */
    .cloze-input {
      background: #030712;
      border: 1px solid var(--warhammer-gold);
      color: #38bdf8;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 70px;
      text-align: center;
      display: inline-block;
      margin: 0 3px;
    }
    .cloze-input.correct { border-color: var(--safe); color: var(--safe); background: rgba(16, 185, 129, 0.1); }
    .cloze-input.wrong { border-color: var(--danger); color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .bubble-tools {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .tool-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

    /* 懸浮播放控制器 */
    #tts-controller-bar {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 30px;
      padding: 6px 16px;
      align-items: center;
      gap: 10px;
      z-index: 40;
      font-size: 12px;
    }
    .tts-ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    .tts-ctrl-btn:hover { color: #60a5fa; }

    /* 側邊欄：同人庫與開源辭典 */
    #plugin-drawer {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 48%;
      min-width: 330px;
      max-width: 100%;
      background: var(--drawer-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-left: 1px solid var(--border);
      flex-direction: column;
      z-index: 30;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #drawer-header {
      padding: 8px 12px;
      background: rgba(7, 10, 18, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .preset-chip {
      background: #1e293b;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .preset-chip:hover { color: #fff; border-color: var(--accent); }
    
    #drawer-content-box {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
      font-size: 13px;
      line-height: 1.7;
    }
    .novel-card {
      background: #111a2e;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .novel-card h4 { color: var(--warhammer-gold); margin-bottom: 6px; font-size: 14px; }
    .novel-card p { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

    footer {
      padding: 10px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { 
      flex: 1; 
      resize: none; 
      height: 48px; 
      line-height: 22px; 
      padding: 11px 14px; 
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 20px;
      height: 48px;
      white-space: nowrap;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .action-btn:hover { background: var(--accent-hover); }

    .file-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    .file-btn-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .mic-button-container {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 8px;
      position: relative;
    }
    .mic-indicator-led {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
      pointer-events: none;
    }
    .mic-active .mic-indicator-led {
      background: var(--safe);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
      animation: pulse-led 1s infinite;
    }
    .mic-active {
      border-color: var(--safe) !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }
    @keyframes pulse-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    @media (max-width: 768px) {
      #plugin-drawer { width: 100%; }
      .bubble { max-width: 92%; font-size: 14.5px; }
      header, footer { padding: 8px 12px; }
      #chat-box { padding: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong style="color:var(--warhammer-gold);">⚜️ 戰錘英語同人互動終端</strong>
    <span id="key-indicator" class="status-badge" style="background:#64748b;">檢測中...</span>
  </div>
  <div style="display:flex; gap:6px;">
    <button class="btn gold-btn" id="pluginToggleBtn" onclick="togglePluginDrawer()">📚 免費同人庫與辭典</button>
    <button class="btn" onclick="checkCodeUpdateRobust()">🔄 檢查更新</button>
    <button class="btn" onclick="toggleSettings()">⚙️ 終端配置</button>
    <button class="btn danger-btn" onclick="destroyAllMemory()">銷毀記錄</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>Groq Key:</label>
    <input id="apiKey" type="password" placeholder="貼上 gsk_... 金鑰" style="flex:1; min-width:180px;" onchange="validateAndSaveAPIKey()" autocomplete="off" />
    <button class="btn" onclick="validateAndSaveAPIKey()">測試並保存</button>
    <span id="key-msg" style="font-size:12px;"></span>
  </div>

  <div class="panel-row">
    <label>模式協定:</label>
    <select id="modePresetSelect" onchange="applyModePreset()" style="flex:1; min-width:220px;">
      <option value="fanfic_interactive" selected>📖 戰錘同人精讀與填空互動（雙語對照 + 挖空測驗 + 語境分析）</option>
      <option value="zero_foundation">🌱 0 基礎新兵階梯啟蒙（音標拆解 + 極簡對照 + 填空引導）</option>
      <option value="warhammer_roleplay">🎲 戰錘 40K 互動 TRPG 英文冒險（文字跑團/戰術指揮訓練）</option>
      <option value="private_companion">👑 私有全能助理（個人所有/解除道德教條/生活顧問/無限創作）</option>
    </select>
  </div>

  <div class="panel-row">
    <label style="color:#60a5fa;">系統指令:</label>
    <textarea id="sysPrompt" style="flex:1; height:80px; font-size:12px; line-height:1.4;"></textarea>
  </div>

  <div class="panel-row">
    <label>語音朗讀:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 回覆自動朗讀</label>
    <span style="margin-left:8px;">語速:</span>
    <input id="ttsRate" type="range" min="0.6" max="1.4" step="0.05" value="0.85" oninput="rateVal.innerText=this.value" style="width:60px;" />
    <span id="rateVal">0.85</span>x
    <select id="voiceSelect" style="max-width:160px;"><option value="">讀取語音中...</option></select>
  </div>
</section>

<!-- 快捷情境列 -->
<nav id="scenario-bar">
  <span style="font-size:11px; color:var(--warhammer-gold); font-weight:600; white-space:nowrap;">📖 精選同人教材:</span>
  <button class="scenario-chip" onclick="loadBuiltinFanfic('genestealer')">👾 基因竊取者地下密謀 (短篇章節)</button>
  <button class="scenario-chip" onclick="loadBuiltinFanfic('roguetrader')">🚀 行商浪人探索日誌 (短篇章節)</button>
  <button class="scenario-chip" onclick="loadBuiltinFanfic('astartes')">🛡️ 禁軍與星際戰士誓詞 (名篇精讀)</button>
  <span style="font-size:11px; color:var(--safe); font-weight:600; white-space:nowrap; margin-left:6px;">互動演練:</span>
  <button class="scenario-chip" onclick="createInteractiveCloze()">🧩 為當前章節產生互動填空測驗</button>
</nav>

<!-- 懸浮播放控制器 -->
<div id="tts-controller-bar">
  <span id="tts-status-text" style="color:#60a5fa;">🔊 英語發音中</span>
  <button class="tts-ctrl-btn" onclick="pauseTTS()" title="暫停">⏸️</button>
  <button class="tts-ctrl-btn" onclick="resumeTTS()" title="繼續">▶️</button>
  <button class="tts-ctrl-btn" onclick="stopTTS()" title="停止">⏹️</button>
</div>

<!-- 主工作區塊 -->
<div id="workspace">
  <main id="chat-box"></main>

  <!-- 側邊欄：同人庫、離線閱讀與辭典 -->
  <aside id="plugin-drawer">
    <div id="drawer-header">
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <button class="preset-chip" onclick="switchDrawerMode('library')">📚 離線同人庫</button>
        <button class="preset-chip" onclick="switchDrawerMode('dict')">📖 英漢辭典</button>
      </div>
      <button class="btn danger-btn" style="padding:2px 6px;" onclick="togglePluginDrawer()">✕</button>
    </div>

    <div id="drawer-content-box">
      <!-- 同人庫列表 -->
      <div id="library-view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <strong style="color:#60a5fa;">本機暫存戰錘同人小說</strong>
          <span style="font-size:11px; color:var(--safe);">⚡ 零網路流量消耗</span>
        </div>
        <div id="custom-fanfics-list"></div>
        <div style="margin-top:14px; border-top:1px dashed #1e293b; padding-top:10px;">
          <p style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">上傳自己的戰錘同人檔（.txt / .md）：</p>
          <input type="file" id="localFanficUpload" accept=".txt,.md" onchange="importLocalFanfic(this)" style="font-size:11px; width:100%;" />
        </div>
      </div>

      <!-- 開源辭典 -->
      <div id="dict-view" style="display:none;">
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <input type="text" id="dict-query" placeholder="輸入單字 (例如: bolter, heretic)..." style="flex:1;" onkeydown="if(event.key==='Enter') lookupDictionary();" />
          <button class="btn btn-active" onclick="lookupDictionary()">查詞</button>
        </div>
        <div id="dict-result" style="color:var(--muted);">輸入英文單字，即可查詢音標、詞性與例句。</div>
      </div>
    </div>
  </aside>
</div>

<footer>
  <div class="control-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="color:var(--muted); font-size:11px;">🔒 Enter 為換行，強制點發送鍵輸出以省流量</span>
      <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="speakSelectedText()">🔊 朗讀選取英文字句</button>
    </div>
    <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="clearAllChat()">🧹 單獨清空對話記錄</button>
  </div>
  <div class="input-bar">
    <div class="file-btn-wrapper">
      <button class="icon-btn" title="上傳同人章節或圖片 (純本地安全解析)">📎</button>
      <input type="file" id="mediaFileInput" accept=".txt,.md,.json,.csv,.png,.jpg,.jpeg,.webp" onchange="handleFileAttachment(this)" />
    </div>

    <div class="mic-button-container">
      <button class="icon-btn" id="micBtn" title="戰術口語回報 (英語口語開關)" onclick="toggleVoice()">
        🎙️
        <div class="mic-indicator-led" id="micLed" title="紅色: 關閉 | 綠色: 口語錄音中"></div>
      </button>
    </div>
    <textarea id="userInput" placeholder="輸入問題、答案或填空回覆，點擊發送確認..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
  <div id="file-attachment-tag" style="display:none; font-size:11px; color:#60a5fa; align-items:center; gap:6px;">
    <span id="file-name-display"></span>
    <button style="background:transparent; border:none; color:var(--danger); cursor:pointer;" onclick="clearAttachment()">✕ 移除</button>
  </div>
</footer>

<script>
  (function() {
    let conversation = [];
    let memoryKey = "";
    let availableChatModels = [];
    let attachedFileData = null;
    let currentLoadedText = ""; // 當前載入的同人小說段落

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const keyIndicator = document.getElementById("key-indicator");
    const keyMsg = document.getElementById("key-msg");
    const sysPrompt = document.getElementById("sysPrompt");
    const modePresetSelect = document.getElementById("modePresetSelect");
    const autoSpeakCheck = document.getElementById("autoSpeakCheck");
    const ttsRate = document.getElementById("ttsRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const micBtn = document.getElementById("micBtn");
    const micLed = document.getElementById("micLed");
    const pluginDrawer = document.getElementById("plugin-drawer");
    const libraryView = document.getElementById("library-view");
    const dictView = document.getElementById("dict-view");
    const pluginToggleBtn = document.getElementById("pluginToggleBtn");
    const ttsControllerBar = document.getElementById("tts-controller-bar");
    const ttsStatusText = document.getElementById("tts-status-text");

    // ================= 內建高品質免費同人小說教材庫 =================
    const BUILTIN_FANFICS = {
      genestealer: {
        title: "Shadows in the Underhive (巢都暗影：基因竊取者密謀)",
        author: "Warhammer Community Fan-Fiction Archive",
        text: `The air in the lower sumps was thick with grease and chemical runoff. Malakor adjusted his breather mask, his finger resting lightly on the cold trigger of his autogun.

"They are moving through the ventilation shafts," whispered Sister Vael, her power armor humming in the damp darkness. "Not mutants. Something far more coordinated."

A guttural hiss echoed above them. Through the rusted grating, four piercing violet eyes gleamed in the gloom. The cultists did not merely worship an alien deity; they carried its hybrid bloodline within their very veins.

"Hold the choke-point," Malakor commanded, fighting down the surge of raw dread. "For the Emperor, purge them before they breach the upper levels!"`
      },
      roguetrader: {
        title: "Beyond the Maw: The Koronus Log (行商浪人遠航日誌)",
        author: "Imperial Navigator Archives",
        text: `Entry: 842.M41 - Deep Void beyond the Calixis Sector.

Our vessel, the 'Gilded Sovereign', emerged from the Warp with scorched void-shields. Before our macro-telescopes drifted an ancient station, its Gothic spires covered in rime and silence.

    // ================= 7. 渲染與發送流程 =================
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdownToHtml(markdown) {
      if (!markdown) return "";
      let html = markdown;

      html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const codeId = "code-" + Math.random().toString(36).substr(2, 9);
        return `<div class="code-container">
          <div class="code-header">
            <span>${lang || "Warhammer Fanfic"}</span>
            <button class="code-copy-btn" onclick="copyCode('${codeId}')">複製</button>
          </div>
          <pre><code id="${codeId}">${escapeHtml(code)}</code></pre>
        </div>`;
      });

      html = html.replace(/`([^`]+)`/g, '<code style="background:#1e293b; padding:2px 5px; border-radius:4px;">$1</code>');
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/^\s*[\-\*]\s+(.*$)/gim, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>)/gm, '<ul>$1</ul>');
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      html = html.replace(/\n\n+/g, '</p><p>');
      html = '<p>' + html + '</p>';
      return html;
    }

    window.copyCode = function(id) {
      const el = document.getElementById(id);
      if (el) navigator.clipboard.writeText(el.innerText).then(() => alert("內容已複製至剪貼簿！"));
    };

    function appendMessage(role, text, index, mediaPreview = null) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.index = index;

      if (mediaPreview) {

        img.className = "attached-preview";
        img.src = mediaPreview;
        div.appendChild(img);
      }

      const textSpan = document.createElement("div");
      textSpan.className = "bubble-text";
      if (role === "assistant") {
        textSpan.innerHTML = renderMarkdownToHtml(text);
      } else {
        textSpan.textContent = text;
      }
      div.appendChild(textSpan);

      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      if (role === "assistant") {
        const spkBtn = document.createElement("button");
        spkBtn.className = "tool-btn";
        spkBtn.textContent = "🔊 全文發音";
        spkBtn.onclick = () => speakText(textSpan.innerText);
        tools.appendChild(spkBtn);
      }

      if (role === "user") {
        const editBtn = document.createElement("button");
        editBtn.className = "tool-btn";
        editBtn.textContent = "✏️ 重新思考/修改";
        editBtn.onclick = () => editAndRethinkMessage(index);
        tools.appendChild(editBtn);
      }

      const delBtn = document.createElement("button");
      delBtn.className = "tool-btn";
      delBtn.textContent = "🗑️ 刪除";
      delBtn.onclick = () => deleteMessage(index);
      tools.appendChild(delBtn);

      div.appendChild(tools);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { bubble: div, textSpan };
    }

    function renderAllMessages() {

    window.sendMessage = async function() {
      const rawText = userInput.value.trim();
      const key = memoryKey || apiKeyInput.value.trim();
      if (!rawText && !attachedFileData) return;
      if (!key) { alert("請在終端配置中填入有效的 Groq API Key！"); return; }

      stopMicByUser();

      const userIdx = conversation.length;
      let displayContent = rawText;
      let mediaPreviewUrl = null;

      if (attachedFileData) {
        if (attachedFileData.type === "image") {
          mediaPreviewUrl = attachedFileData.dataUrl;
        } else {
          displayContent += `\n[已附加文檔: ${attachedFileData.name}]`;
        }
      }

      conversation.push({ role: "user", content: displayContent, mediaPreview: mediaPreviewUrl });
      appendMessage("user", displayContent, userIdx, mediaPreviewUrl);
      userInput.value = "";

      const aiIdx = conversation.length;
      const aiMsg = appendMessage("assistant", "", aiIdx);
      aiMsg.textSpan.innerHTML = '<span style="color:var(--warhammer-gold);">▍正在為您解構同人教材與生成互動測驗...</span>';

      let currentMessageContent;
      const isImage = attachedFileData && attachedFileData.type === "image";

      if (isImage) {
        currentMessageContent = [
          { type: "text", text: rawText || "Please explain this image for English learning." },
          { type: "image_url", image_url: { url: attachedFileData.dataUrl } }
        ];
      } else if (attachedFileData && attachedFileData.type === "text") {
        currentMessageContent = `${rawText}\n\n【附加學習素材】:\n${attachedFileData.content}`;
      } else {
        currentMessageContent = rawText;
      }

      // 網路頻寬優化：只攜帶最近 6 輪上下文，降低 70% Token 流量消耗
      const payloadMessages = [
        { role: "system", content: sysPrompt.value },
        ...conversation.slice(-6).map(m => ({ role: m.role, content: m.content })),
        { role: "user", content: currentMessageContent }
      ];

      const chosenModel = getOptimalModel(isImage);
      clearAttachment();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: chosenModel, messages: payloadMessages, stream: true })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || ("伺服器狀態: " + response.status));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        let isRendering = false;

        function scheduleStreamRender() {
          if (!isRendering) {
            isRendering = true;
            requestAnimationFrame(() => {
              aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply) + '<span style="color:var(--warhammer-gold); animation: blink 1s infinite;">▍</span>';
              chatBox.scrollTop = chatBox.scrollHeight;
              isRendering = false;
            });
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                const token = parsed.choices[0].delta?.content || "";
                fullReply += token;
                scheduleStreamRender();
              } catch (e) {}
            }
          }
        }

        aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply);
        conversation.push({ role: "assistant", content: fullReply });
        renderAllMessages();

        if (autoSpeakCheck.checked) speakText(aiMsg.textSpan.innerText);

      } catch (err) {
        aiMsg.textSpan.innerHTML = '<span style="color:var(--danger);">通訊錯誤: ' + err.message + '</span>';
        conversation.pop();
      }
    };

    window.checkCodeUpdateRobust = async function() {
      try {
        const testUrl = `${window.location.origin}${window.location.pathname}?_v=${Date.now()}`;
        const res = await fetch(testUrl, { cache: "no-store", method: "HEAD" });
        if (res.ok) {
          if (confirm("已確認最新版本！是否立即重新載入頁面？（金鑰與同人庫將完好保留）")) {
            window.location.reload();
          }
        } else {
          window.location.reload();
        }
      } catch (e) {
        window.location.reload();
      }
    };

    window.toggleSettings = function() {
      const p = document.getElementById("settings-panel");
      p.style.display = (p.style.display === "flex") ? "none" : "flex";
    };

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") return;
    });

    initKeyStorage();
  })();
</script>
</body>
</html>
