<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src https://api.groq.com https://api.dictionaryapi.dev https://api.allorigins.win https://corsproxy.io; frame-src https:; img-src 'self' data: blob:; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>COGITATOR // WARHAMMER 40K TERMINAL</title>
  <style>
    :root {
      --bg: #05070a;
      --terminal-black: #080d12;
      --gold-primary: #d4af37;
      --gold-bright: #ffd700;
      --gold-dark: #8c7322;
      --green-glow: #10b981;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --purity-seal: #b91c1c;
      --border-gothic: #2a384c;
      --bubble-user: #172554;
      --bubble-ai: #0b1320;
      --drawer-bg: rgba(8, 13, 20, 0.98);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: ui-monospace, "SF Mono", "Courier New", monospace, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      position: relative;
    }
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 99;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.7;
    }
    header {
      padding: 10px 14px;
      background: var(--terminal-black);
      border-bottom: 2px solid var(--gold-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 20;
    }
    .status-badge {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--green-glow);
      color: #000;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .btn {
      background: #0d1520;
      border: 1px solid var(--border-gothic);
      color: var(--text);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn:hover { background: #162234; border-color: var(--gold-primary); color: #fff; }
    .gold-btn { border-color: var(--gold-primary); color: var(--gold-primary); }
    .gold-btn:hover { background: rgba(212, 175, 55, 0.15); }
    .danger-btn { border-color: var(--purity-seal); color: #fca5a5; }

    #settings-panel {
      display: none;
      background: #090f17;
      border-bottom: 2px solid var(--gold-dark);
      padding: 12px 14px;
      gap: 10px;
      flex-direction: column;
      font-size: 12px;
      max-height: 60vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 20;
    }
    .panel-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .panel-row label { min-width: 90px; color: var(--gold-primary); font-size: 11px; }
    input, select, textarea, button {
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid var(--border-gothic);
      background: #030508;
      color: var(--text);
      padding: 6px 8px;
      outline: none;
      font-family: inherit;
    }

    #scenario-bar {
      padding: 6px 12px;
      background: #06090e;
      border-bottom: 1px solid var(--border-gothic);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      align-items: center;
      scrollbar-width: none;
    }
    #scenario-bar::-webkit-scrollbar { display: none; }
    .scenario-chip {
      background: #0c121a;
      border: 1px solid #1e2c3d;
      color: #93c5fd;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .scenario-chip:hover { border-color: var(--gold-primary); color: #fff; }
    .zero-chip { border-color: var(--green-glow) !important; color: #a7f3d0 !important; }

    #workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      contain: layout;
    }
    .bubble {
      max-width: 90%;
      padding: 14px 16px;
      border-radius: 8px;
      line-height: 1.7;
      word-break: break-word;
      font-size: 14px;
      position: relative;
    }
    .user { 
      align-self: flex-end; 
      background: var(--bubble-user); 
      border: 1px solid #2563eb;
      color: #fff; 
      white-space: pre-wrap; 
    }
    .assistant { 
      align-self: flex-start; 
      background: var(--bubble-ai); 
      color: #e2e8f0; 
      border: 1px solid var(--border-gothic); 
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    }
    .assistant h1, .assistant h2, .assistant h3 { margin: 12px 0 6px 0; color: var(--gold-primary); }
    .assistant h1 { font-size: 1.3em; border-bottom: 1px solid var(--gold-dark); padding-bottom: 3px; }
    .assistant strong { color: var(--gold-bright); font-weight: 600; }
    .bubble-tools {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 4px;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 10.5px;
      padding: 2px 4px;
    }
    .tool-btn:hover { color: var(--gold-bright); }

    /* 內建檔案庫抽屜 (含直接閱讀器與實時更新) */
    #plugin-drawer {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 50%;
      min-width: 320px;
      max-width: 100%;
      background: var(--drawer-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 2px solid var(--gold-dark);
      flex-direction: column;
      z-index: 30;
      box-shadow: -8px 0 32px rgba(0,0,0,0.8);
    }
    #drawer-header {
      padding: 8px 12px;
      background: #040609;
      border-bottom: 1px solid var(--border-gothic);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .preset-chip {
      background: #0c121c;
      color: var(--muted);
      border: 1px solid var(--border-gothic);
      font-size: 10.5px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .preset-chip:hover { color: var(--gold-bright); border-color: var(--gold-primary); }
    .preset-chip.active { background: var(--gold-dark); color: #fff; }

    #drawer-content-box {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      font-size: 12.5px;
      line-height: 1.7;
    }
    .archive-item {
      background: #0b111a;
      border: 1px solid var(--border-gothic);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .archive-item:hover { border-color: var(--gold-primary); }
    .archive-item h4 { color: var(--gold-primary); margin-bottom: 4px; font-size: 13px; }
    .archive-item p { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    
    /* 內部原汁原味閱讀器面板 */
    #internal-reader {
      display: none;
      background: #06090e;
      border: 1px solid var(--border-gothic);
      border-radius: 6px;
      padding: 14px;
      margin-top: 8px;
    }
    #internal-reader h3 { color: var(--gold-bright); margin-bottom: 8px; font-size: 14px; border-bottom: 1px dashed var(--gold-dark); padding-bottom: 4px; }
    #internal-reader-body { white-space: pre-wrap; font-size: 13px; color: #cbd5e1; line-height: 1.8; max-height: 380px; overflow-y: auto; }

    footer {
      padding: 8px 12px;
      background: var(--terminal-black);
      border-top: 1px solid var(--border-gothic);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      z-index: 20;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .input-bar { display: flex; gap: 6px; align-items: center; }
    textarea { 
      flex: 1; 
      resize: none; 
      height: 44px; 
      line-height: 20px; 
      padding: 10px; 
      font-size: 13px;
    }
    .action-btn {
      background: var(--gold-primary);
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: 700;
      padding: 0 16px;
      height: 44px;
      white-space: nowrap;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .action-btn:hover { background: var(--gold-bright); }

    .mic-button-container {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-gothic);
      color: var(--text);
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border-radius: 6px;
      position: relative;
    }
    .mic-indicator-led {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 5px rgba(239, 68, 68, 0.9);
      pointer-events: none;
    }
    .mic-active .mic-indicator-led {
      background: var(--green-glow);
      box-shadow: 0 0 8px rgba(16, 185, 129, 1);
      animation: pulse-led 1s infinite;
    }
    @keyframes pulse-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    @media (max-width: 768px) {
      #plugin-drawer {
        width: 100%;
        top: auto;
        bottom: 0;
        height: 75vh;
        border-left: none;
        border-top: 2px solid var(--gold-dark);
        border-radius: 12px 12px 0 0;
      }
      .bubble { max-width: 95%; font-size: 13.5px; padding: 12px 14px; }
      header, footer { padding: 6px 10px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:6px;">
    <strong style="color:var(--gold-primary); font-size:12px; letter-spacing:0.04em;">COGITATOR//40K</strong>
    <span id="key-indicator" class="status-badge" style="background:#475569;">OFFLINE</span>
  </div>
  <div style="display:flex; gap:4px;">
    <button class="btn gold-btn" id="pluginToggleBtn" onclick="togglePluginDrawer()">📜 典籍庫/作品閱讀</button>
    <button class="btn" onclick="checkCodeUpdateRobust()">🔄 更新</button>
    <button class="btn" onclick="toggleSettings()">⚙️ 配置</button>

  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>Groq API Key:</label>
    <input id="apiKey" type="password" placeholder="貼上 gsk_... 金鑰" style="flex:1; min-width:180px;" onchange="validateAndSaveAPIKey()" autocomplete="off" />
    <button class="btn" onclick="validateAndSaveAPIKey()">校驗並保存</button>
    <span id="key-msg" style="font-size:11px;"></span>
  </div>

  <div class="panel-row">
    <label>思維訓練模式:</label>
    <select id="modePresetSelect" onchange="applyModePreset()" style="flex:1; min-width:200px;">
      <option value="zero_foundation" selected>🌱 0基礎戰錘啟蒙（單詞拆節 + 骨架對照 + 填空測驗）</option>
      <option value="fanfic_interactive">⚔️ 戰錘同人精讀（黑暗哥特詞彙 + 雙向語境拆解）</option>
      <option value="warhammer_roleplay">🎲 戰錘TRPG跑團互動（GM戰術指揮 + 口語寫作修飾）</option>
      <option value="private_companion">👑 私有全能助理（解除教條審查 / 深度情感 / 創作）</option>
    </select>
  </div>

  <div class="panel-row">
    <label style="color:var(--gold-primary);">機魂核心指令:</label>
    <textarea id="sysPrompt" style="flex:1; height:65px; font-size:11px; line-height:1.4;"></textarea>
  </div>

  <div class="panel-row">
    <label>發音與音效:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 自動朗讀</label>
    <label style="min-width:auto; margin-left:6px;"><input type="checkbox" id="soundFxCheck" checked /> 鍵盤機械音</label>
    <span style="margin-left:6px;">語速:</span>
    <input id="ttsRate" type="range" min="0.6" max="1.4" step="0.05" value="0.85" oninput="rateVal.innerText=this.value" style="width:50px;" />
    <span id="rateVal">0.85</span>x
    <select id="voiceSelect" style="max-width:140px;"><option value="">讀取語音中...</option></select>

</section>

<!-- 快速語境戰術列 -->
<nav id="scenario-bar">
  <span style="font-size:10.5px; color:var(--gold-primary); white-space:nowrap;">快速指令:</span>
  <button class="scenario-chip zero-chip" onclick="triggerQuickScenario('zero_vocabulary')">🛡️ 0基礎 10個戰錘單字</button>
  <button class="scenario-chip zero-chip" onclick="triggerQuickScenario('zero_simple_dialogue')">💬 0基礎 戰術對答</button>
  <button class="scenario-chip" onclick="openReaderFromScenario('genestealer')">📖 閱讀：基因竊取者地下密謀</button>
  <button class="scenario-chip" onclick="openReaderFromScenario('roguetrader')">🚀 閱讀：行商浪人遠航日誌</button>
  <button class="scenario-chip" onclick="createInteractiveCloze()">🧩 為當前章節產生填空測驗</button>
</nav>

<!-- 主工作區塊 -->
<div id="workspace">
  <main id="chat-box"></main>

  <!-- 內部原創典籍庫與閱讀器抽屜 -->
  <aside id="plugin-drawer">
    <div id="drawer-header">
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <button class="preset-chip active" id="tab-vault" onclick="switchDrawerTab('vault')">📜 典籍作品庫</button>
        <button class="preset-chip" id="tab-live" onclick="switchDrawerTab('live')">🌐 即時同人動態</button>
        <button class="preset-chip" id="tab-dict" onclick="switchDrawerTab('dict')">📖 英漢辭典</button>

      <button class="btn danger-btn" style="padding:2px 6px;" onclick="togglePluginDrawer()">✕</button>

    <div id="drawer-content-box">
      <!-- 1. 內部作品列表與內嵌閱讀器 -->
      <div id="vault-tab-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="color:var(--gold-primary);">精選戰錘作品與短篇（點擊內嵌閱讀）</strong>
          <button class="btn" style="padding:2px 6px; font-size:10px;" onclick="fetchLiveCommunityNews()">🔄 實時聯網同步</button>

        <!-- 原生內嵌閱讀器面板 -->

          <div style="display:flex; justify-content:space-between; align-items:center;">

          <div style="margin-top:10px; display:flex; gap:6px;">

        <div style="margin-top:12px; border-top:1px dashed var(--border-gothic); padding-top:8px;">

          <span style="font-size:10px; color:var(--safe);">即時在線</span>

        <div id="live-news-feed" style="color:var(--text-dim); font-size:12px;">正在連線戰錘最新發布...</div>
      </div>

      <div id="dict-tab-content" style="display:none;">
        <div style="display:flex; gap:4px; margin-bottom:8px;">

    <button class="action-btn" id="sendBtn" onclick="sendMessage()">傳送</button>

<script>
  (function() {
    let conversation = [];
    let memoryKey = "";
    let availableChatModels = [];
    let currentLoadedTitle = "";
    let currentLoadedContent = "";

    // 內建模擬機械音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playMechBeep(freq = 600, duration = 0.03) {
      if (!document.getElementById("soundFxCheck").checked) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const keyIndicator = document.getElementById("key-indicator");
    const keyMsg = document.getElementById("key-msg");
    const sysPrompt = document.getElementById("sysPrompt");
    const modePresetSelect = document.getElementById("modePresetSelect");
    const autoSpeakCheck = document.getElementById("autoSpeakCheck");
    const ttsRate = document.getElementById("ttsRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const micBtn = document.getElementById("micBtn");
    const micLed = document.getElementById("micLed");
    const pluginDrawer = document.getElementById("plugin-drawer");
    const pluginToggleBtn = document.getElementById("pluginToggleBtn");

    // ================= 1. 內建戰錘典籍與即時同人庫 =================
    const LOCAL_ARCHIVES = [
      {
        id: "genestealer",
        title: "Shadows in the Underhive (巢都暗影：基因竊取者密謀)",
        source: "Warhammer Fanfic Archive",

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdownToHtml(markdown) {
      if (!markdown) return "";
      let html = markdown;
      html = html.replace(/`([^`]+)`/g, '<code style="background:#111b27; color:#6ee7b7; padding:2px 4px; border-radius:3px; font-size:12px;">$1</code>');
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/^\s*[\-\*]\s+(.*$)/gim, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>)/gm, '<ul>$1</ul>');
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      html = html.replace(/\n\n+/g, '</p><p>');
      html = '<p>' + html + '</p>';
      return html;
    }

    function appendMessage(role, text, index) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.index = index;

      const textSpan = document.createElement("div");
      textSpan.className = "bubble-text";
      if (role === "assistant") textSpan.innerHTML = renderMarkdownToHtml(text);
      else textSpan.textContent = text;
      div.appendChild(textSpan);

      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      if (role === "assistant") {
        const spkBtn = document.createElement("button");
        spkBtn.className = "tool-btn";
        spkBtn.textContent = "🔊 慢速朗讀";
        spkBtn.onclick = () => speakText(textSpan.innerText);
        tools.appendChild(spkBtn);
      }

      const delBtn = document.createElement("button");
      delBtn.className = "tool-btn";
      delBtn.textContent = "🗑️ 刪除";
      delBtn.onclick = () => { conversation.splice(index, 1); renderAllMessages(); };
      tools.appendChild(delBtn);

      div.appendChild(tools);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { bubble: div, textSpan };
    }

      chatBox.textContent = "";

    window.sendMessage = async function() {
      const rawText = userInput.value.trim();
      const key = memoryKey || apiKeyInput.value.trim();
      if (!rawText) return;
      if (!key) { alert("請在配置中填入有效的 Groq API Key！"); return; }

      playMechBeep(450, 0.05);
      stopMicByUser();

      const userIdx = conversation.length;
      conversation.push({ role: "user", content: rawText });
      appendMessage("user", rawText, userIdx);
      userInput.value = "";

      const aiIdx = conversation.length;
      const aiMsg = appendMessage("assistant", "", aiIdx);
      aiMsg.textSpan.innerHTML = '<span style="color:var(--gold-primary);">▍機魂深層思維運算中...</span>';

      const payloadMessages = [
        { role: "system", content: sysPrompt.value },
        ...conversation.slice(-6).map(m => ({ role: m.role, content: m.content }))
      ];

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: getOptimalModel(), messages: payloadMessages, stream: true })
        });

        if (!response.ok) throw new Error("狀態碼: " + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        let isRendering = false;

        function scheduleStreamRender() {
          if (!isRendering) {
            isRendering = true;
            requestAnimationFrame(() => {
              aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply) + '<span style="color:var(--gold-bright); animation: blink 1s infinite;">▍</span>';
              chatBox.scrollTop = chatBox.scrollHeight;
              isRendering = false;
            });
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                fullReply += (parsed.choices[0].delta?.content || "");
                scheduleStreamRender();
              } catch (e) {}
            }
          }
        }

        aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply);
        conversation.push({ role: "assistant", content: fullReply });
        renderAllMessages();

        if (autoSpeakCheck.checked) speakText(aiMsg.textSpan.innerText);
      } catch (err) {
        aiMsg.textSpan.innerHTML = '<span style="color:var(--danger);">機魂中斷: ' + err.message + '</span>';
        conversation.pop();
      }
    };

      const p = document.getElementById("settings-panel");
      p.style.display = (p.style.display === "flex") ? "none" : "flex";
    };

    window.togglePluginDrawer = function() {
      playMechBeep(500, 0.03);
      const isVisible = (pluginDrawer.style.display === "flex");
      pluginDrawer.style.display = isVisible ? "none" : "flex";
      pluginToggleBtn.classList.toggle("gold-btn", !isVisible);
    };

    userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") return; });

    initKeyStorage();
    renderArchiveList();
  })();
</script>
</body>
</html>
