<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專業輕量 AI 終端</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --user: #2563eb;
      --ai: #334155;
      --border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #16a34a;
      color: #fff;
    }
    .status-badge.offline { background: #dc2626; }
    .panel-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
    }
    #settings-panel {
      display: none;
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      gap: 12px;
      flex-direction: column;
      font-size: 13px;
    }
    .panel-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .panel-row label { min-width: 90px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      padding: 6px 10px;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: var(--user); color: #fff; }
    .assistant { align-self: flex-start; background: var(--ai); color: #e2e8f0; }
    footer {
      padding: 10px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { flex: 1; resize: none; height: 44px; }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 14px;
      height: 44px;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .recording { background: #dc2626 !important; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong>輕量 AI 終端</strong>
    <span id="net-status" class="status-badge">在線</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="panel-toggle" onclick="toggleSettings()">參數與記憶庫</button>
    <button class="panel-toggle" onclick="clearHistory()">清除對話</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>API Key:</label>
    <input id="apiKey" type="password" placeholder="Groq API Key (gsk_...)" style="flex:1;" />
    <label>模型:</label>
    <select id="modelSelect"><option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option><option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option></select>
  </div>
  <div class="panel-row">
    <label>溫度 (隨機性):</label>
    <input id="tempRange" type="range" min="0" max="1" step="0.05" value="0.7" oninput="tempVal.innerText = this.value" />
    <span id="tempVal">0.7</span>
    <label style="margin-left:12px;">上下文截斷:</label>
    <select id="windowSelect">
      <option value="6">保留最新 6 輪對話</option>
      <option value="12" selected>保留最新 12 輪對話</option>
      <option value="20">保留最新 20 輪對話</option>
    </select>
  </div>
  <div class="panel-row">
    <label>人設 (System):</label>
    <input id="sysPrompt" type="text" value="你是一位精準、樂於助人且具備清晰邏輯思維的繁體中文 AI 助理。" style="flex:1;" />
  </div>
  <div class="panel-row">
    <label>持久常駐檔案:</label>
    <input type="file" id="fileInput" accept=".txt,.md,.json,.csv" />
    <span id="fileMemoryInfo" style="color:var(--muted);">尚未匯入常駐文件</span>
  </div>
</section>

<main id="chat-box"></main>

<footer>
  <div class="input-bar">
    <button class="icon-btn" id="micBtn" title="語音輸入" onclick="toggleVoice()">🎙️</button>
    <textarea id="userInput" placeholder="輸入訊息... (Enter 發送, Shift+Enter 換行)"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
</footer>

<script>
  let conversation = [];
  let permanentContext = ""; // 常駐記憶（上傳的文件內容）

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("userInput");
  const apiKeyInput = document.getElementById("apiKey");
  const modelSelect = document.getElementById("modelSelect");
  const tempRange = document.getElementById("tempRange");
  const sysPrompt = document.getElementById("sysPrompt");
  const windowSelect = document.getElementById("windowSelect");
  const netStatus = document.getElementById("net-status");
  const micBtn = document.getElementById("micBtn");
  const fileMemoryInfo = document.getElementById("fileMemoryInfo");

  // 1. 本地儲存讀取
  if (localStorage.getItem("ai_api_key")) apiKeyInput.value = localStorage.getItem("ai_api_key");
  if (localStorage.getItem("ai_perm_memory")) {
    permanentContext = localStorage.getItem("ai_perm_memory");
    fileMemoryInfo.innerText = "已加載持久記憶 (" + permanentContext.length + " 字)";
  }
  apiKeyInput.addEventListener("change", () => localStorage.setItem("ai_api_key", apiKeyInput.value.trim()));

  // 2. 網路環境監聽
  function updateOnlineStatus() {
    if (navigator.onLine) {
      netStatus.className = "status-badge";
      netStatus.innerText = "在線";
    } else {
      netStatus.className = "status-badge offline";
      netStatus.innerText = "離線中";
    }
  }
  window.addEventListener("online", updateOnlineStatus);
  window.addEventListener("offline", updateOnlineStatus);

  // 3. 文件記憶讀取 (TXT / MD / CSV 等純文本)
  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      permanentContext = evt.target.result.slice(0, 8000); // 截取前 8000 字元避免超出上下文
      localStorage.setItem("ai_perm_memory", permanentContext);
      fileMemoryInfo.innerText = `已綁定記憶：${file.name} (${permanentContext.length} 字)`;
      alert(`文件「${file.name}」已寫入常駐記憶，清除對話也不會遺忘！`);
    };
    reader.readAsText(file);
  });

  function toggleSettings() {
    const p = document.getElementById("settings-panel");
    p.style.display = (p.style.display === "flex") ? "none" : "flex";
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  // 4. 打字機流式輸出（Streaming）
  async function sendMessage() {
    const text = userInput.value.trim();
    const key = apiKeyInput.value.trim();
    if (!text) return;
    if (!key) { alert("請先於設定面板中填入 Groq API Key！"); return; }
    if (!navigator.onLine) { alert("目前處於離線狀態，請確認網路連線。"); return; }

    appendMessage("user", text);
    conversation.push({ role: "user", content: text });
    userInput.value = "";

    // 長度截斷控制：只取最後 N 筆對話
    const maxTurns = parseInt(windowSelect.value, 10);
    let trimmedHistory = conversation.slice(-maxTurns);

    // 組裝帶有常駐檔案記憶與自訂 System Prompt 的請求上下文
    let fullSystemPrompt = sysPrompt.value;
    if (permanentContext) {
      fullSystemPrompt += "\n\n【用戶提供的永久記憶與參考背景資料】：\n" + permanentContext;
    }

    const payloadMessages = [
      { role: "system", content: fullSystemPrompt },
      ...trimmedHistory
    ];

    const aiBubble = appendMessage("assistant", "");
    aiBubble.innerText = "▍";

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: payloadMessages,
          temperature: parseFloat(tempRange.value),
          stream: true // 開啟打字機流式輸出
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error ? errData.error.message : "伺服器無回應");
      }

      // 讀取 SSE Stream 資料流
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let fullReply = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split("\n");

        for (const line of lines) {
          if (line.startsWith("data: ") && line !== "data: [DONE]") {
            try {
              const parsed = JSON.parse(line.replace("data: ", ""));
              const token = parsed.choices[0].delta?.content || "";
              fullReply += token;
              aiBubble.innerText = fullReply + "▍";
              chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {}
          }
        }
      }

      aiBubble.innerText = fullReply;
      conversation.push({ role: "assistant", content: fullReply });

    } catch (err) {
      aiBubble.innerText = "出錯了: " + err.message;
      conversation.pop();
    }
  }

  // 5. 語音輸入無障礙功能 (Web Speech API)
  let recognition = null;
  let isRecording = false;

  if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = "zh-TW";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      userInput.value += transcript;
      toggleVoice(); // 辨識完成後停止
    };

    recognition.onerror = () => toggleVoice();
    recognition.onend = () => { if (isRecording) toggleVoice(); };
  }

  function toggleVoice() {
    if (!recognition) {
      alert("目前瀏覽器不支援語音辨識 API，請使用 Chrome 或 Safari。");
      return;
    }
    if (!isRecording) {
      recognition.start();
      isRecording = true;
      micBtn.classList.add("recording");
    } else {
      recognition.stop();
      isRecording = false;
      micBtn.classList.remove("recording");
    }
  }

  function clearHistory() {
    conversation = [];
    chatBox.innerHTML = "";
    appendMessage("assistant", "對話紀錄已清空。（常駐文件檔案記憶依然保留）");
  }

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
