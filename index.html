<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src https://api.groq.com; frame-src https:; img-src 'self' data: https:; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>專業 AI 深度推理與智慧工作終端</title>
  <style>
    :root {
      --bg: #07090e;
      --card: #0e131f;
      --panel: #0a0f1a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user: #1d4ed8;
      --ai: #111827;
      --border: #1e293b;
      --danger: #ef4444;
      --safe: #10b981;
      --code-bg: #030712;
      --drawer-bg: rgba(10, 15, 26, 0.96);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      position: relative;
    }
    header {
      padding: 10px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
      z-index: 20;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--safe);
      color: #fff;
    }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #1a2333; border-color: var(--accent); }
    .btn-active { background: var(--accent) !important; color: #fff; border-color: var(--accent); }
    .danger-btn { border-color: var(--danger); color: #fca5a5; }

    #settings-panel {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      gap: 12px;
      flex-direction: column;
      font-size: 13px;
      max-height: 55vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 20;
    }
    .panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel-row label { min-width: 90px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #07090e;
      color: var(--text);
      padding: 6px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    /* 工作主視窗 */
    #workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      contain: layout;
    }
    .bubble {
      max-width: 86%;
      padding: 16px 20px;
      border-radius: 12px;
      line-height: 1.8;
      word-break: break-word;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .user { 
      align-self: flex-end; 
      background: var(--user); 
      color: #fff; 
      white-space: pre-wrap; 
    }
    .assistant { 
      align-self: flex-start; 
      background: var(--ai); 
      color: #e2e8f0; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    
    /* 大模型級 Markdown 渲染美化樣式 */
    .assistant h1, .assistant h2, .assistant h3 { margin: 12px 0 6px 0; color: #60a5fa; }
    .assistant h1 { font-size: 1.35em; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .assistant h2 { font-size: 1.2em; }
    .assistant h3 { font-size: 1.05em; }
    .assistant p { margin-bottom: 8px; }
    .assistant ul, .assistant ol { margin: 6px 0 8px 20px; }
    .assistant li { margin-bottom: 4px; }
    .assistant strong { color: #93c5fd; font-weight: 600; }
    .assistant hr { border: none; border-top: 1px solid #1e293b; margin: 12px 0; }
    .assistant table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
    .assistant th, .assistant td { border: 1px solid #334155; padding: 6px 10px; text-align: left; }
    .assistant th { background: #0f172a; color: #60a5fa; }
    
    /* 程式碼塊美化與一鍵複製 */
    .code-container {
      position: relative;
      background: var(--code-bg);
      border: 1px solid #1e293b;
      border-radius: 6px;
      margin: 10px 0;
      overflow: hidden;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: #0f172a;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid #1e293b;
    }
    .code-copy-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .code-copy-btn:hover { color: #fff; }
    pre { padding: 10px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }

    /* 思考折疊面板 */
    .thought-details {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      border-radius: 6px;
      margin-bottom: 12px;
      padding: 6px 10px;
      font-size: 12px;
      color: #94a3b8;
    }
    .thought-details summary {
      cursor: pointer;
      color: #60a5fa;
      font-weight: 500;
      user-select: none;
    }
    .thought-content {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #1e293b;
      line-height: 1.6;
    }

    .bubble-tools {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .tool-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

    /* 安全沙盒延伸側邊視窗 */
    #plugin-drawer {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 50%;
      min-width: 320px;
      max-width: 100%;
      background: var(--drawer-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-left: 1px solid var(--border);
      flex-direction: column;
      z-index: 30;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #drawer-header {
      padding: 8px 12px;
      background: rgba(7, 10, 18, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .preset-chip {
      background: #1e293b;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .preset-chip:hover { color: #fff; border-color: var(--accent); }
    #drawer-url-input {
      flex: 1;
      font-size: 11px;
      padding: 4px 8px;
      min-width: 140px;
    }
    .sandbox-shield-tag {
      font-size: 10px;
      color: var(--safe);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    #plugin-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    footer {
      padding: 10px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { 
      flex: 1; 
      resize: none; 
      height: 48px; 
      line-height: 22px; 
      padding: 11px 14px; 
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 20px;
      height: 48px;
      white-space: nowrap;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .action-btn:hover { background: var(--accent-hover); }

    .mic-button-container {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 8px;
      position: relative;
    }
    .mic-indicator-led {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
      pointer-events: none;
    }
    .mic-active .mic-indicator-led {
      background: var(--safe);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
      animation: pulse-led 1s infinite;
    }
    .mic-active {
      border-color: var(--safe) !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }
    @keyframes pulse-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    @media (max-width: 768px) {
      #plugin-drawer { width: 100%; }
      .bubble { max-width: 92%; font-size: 14.5px; }
      header, footer { padding: 8px 12px; }
      #chat-box { padding: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong style="color:#60a5fa;">深度推理安全終端</strong>
    <span id="key-indicator" class="status-badge" style="background:#64748b;">檢測中...</span>
  </div>
  <div style="display:flex; gap:6px;">
    <button class="btn" id="pluginToggleBtn" onclick="togglePluginDrawer()">🧩 延伸輔助工具</button>
    <button class="btn" onclick="checkCodeUpdate()">🔄 檢查更新</button>
    <button class="btn" onclick="toggleSettings()">⚙️ 終端配置</button>
    <button class="btn danger-btn" onclick="destroyAllMemory()">銷毀記錄</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>Groq Key:</label>
    <input id="apiKey" type="password" placeholder="貼上 gsk_... 金鑰 (自動保存)" style="flex:1; min-width:180px;" onchange="validateAndSaveAPIKey()" autocomplete="off" />
    <button class="btn" onclick="validateAndSaveAPIKey()">測試並保存</button>
    <span id="key-msg" style="font-size:12px;"></span>
  </div>

  <div class="panel-row">
    <label style="color:#60a5fa;">系統人設:</label>
    <textarea id="sysPrompt" style="flex:1; height:75px; font-size:12px; line-height:1.4;">你是一位具備頂尖洞察力與嚴密推理能力的繁體中文分析專家。
你的職責是針對使用者的提問進行深度剖析、邏輯梳理與要點整合。
【輸出規範】：
1. 嚴禁任何形式的推託、拒絕或列舉外部空泛網址。
2. 每次回覆皆須維持結構化完整敘述，包含：「核心定性摘要」、「深入分點推導」與「整體評估洞見」。
3. 採用標準繁體中文 Markdown 格式，適度使用粗體與清單強化層次。</textarea>
  </div>

  <div class="panel-row">
    <label>語音朗讀:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 回覆自動朗讀</label>
    <span style="margin-left:8px;">語速:</span>
    <input id="ttsRate" type="range" min="0.5" max="2.0" step="0.1" value="1.0" oninput="rateVal.innerText=this.value" style="width:60px;" />
    <span id="rateVal">1.0</span>x
    <select id="voiceSelect" style="max-width:160px;"><option value="">讀取語音中...</option></select>
  </div>
</section>

<!-- 主工作區塊：左側對話，右側安全隔離沙盒 -->
<div id="workspace">
  <main id="chat-box"></main>

  <aside id="plugin-drawer">
    <div id="drawer-header">
      <span class="sandbox-shield-tag">🛡️ 隱私沙盒已受隔離</span>
      <div style="display:flex; gap:4px;">
        <button class="preset-chip" onclick="quickLoad('https://www.google.com/search?igu=1')">Google</button>
        <button class="preset-chip" onclick="quickLoad('https://tw.yahoo.com')">Yahoo</button>
        <button class="preset-chip" onclick="quickLoad('https://zh.m.wikipedia.org')">維基百科</button>
      </div>
      <input type="url" id="drawer-url-input" placeholder="輸入網址..." value="https://www.google.com/search?igu=1" />
      <button class="btn" style="padding:2px 6px;" onclick="loadPluginUrl()">載入</button>
      <button class="btn" style="padding:2px 6px;" onclick="popOutPlugin()" title="外跳獨立瀏覽">↗</button>
      <button class="btn danger-btn" style="padding:2px 6px;" onclick="togglePluginDrawer()">✕</button>
    </div>
    <iframe 
      id="plugin-frame" 
      sandbox="allow-scripts allow-forms allow-popups" 
      permissions-policy="camera=(), microphone=(), payment=(), geolocation=()"
      src="about:blank">
    </iframe>
  </aside>
</div>

<footer>
  <div class="control-bar">
    <span style="color:var(--muted); font-size:11px;">🔒 傳送防護：Enter 僅供換行，僅能以「發送」鍵輸出以確保效率與節省流量</span>
    <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="clearAllChat()">🧹 單獨清空對話記錄</button>
  </div>
  <div class="input-bar">
    <div class="mic-button-container">
      <button class="icon-btn" id="micBtn" title="手動開關麥克風 (點擊啟動/關閉)" onclick="toggleVoice()">
        🎙️
        <div class="mic-indicator-led" id="micLed" title="紅色: 關閉 | 綠色: 錄音中"></div>
      </button>
    </div>
    <textarea id="userInput" placeholder="請輸入完整問題或論述內容 (Enter/Shift+Enter 皆為換行，點發送鍵確認)..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
</footer>

<script>
  (function initSecurityShield() {
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }
  })();

  (function() {
    let conversation = [];
    let memoryKey = "";
    let availableChatModels = [];

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const keyIndicator = document.getElementById("key-indicator");
    const keyMsg = document.getElementById("key-msg");
    const sysPrompt = document.getElementById("sysPrompt");
    const autoSpeakCheck = document.getElementById("autoSpeakCheck");
    const ttsRate = document.getElementById("ttsRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const micBtn = document.getElementById("micBtn");
    const micLed = document.getElementById("micLed");
    const pluginDrawer = document.getElementById("plugin-drawer");
    const pluginFrame = document.getElementById("plugin-frame");
    const drawerUrlInput = document.getElementById("drawer-url-input");
    const pluginToggleBtn = document.getElementById("pluginToggleBtn");

    // ================= 輕量高效 Markdown / LaTeX 原生解析器 =================
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdownToHtml(markdown) {
      if (!markdown) return "";
      let html = markdown;

      // 解析程式碼區塊
      html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const langStr = lang || "code";
        const codeId = "code-" + Math.random().toString(36).substr(2, 9);
        return `<div class="code-container">
          <div class="code-header">
            <span>${langStr}</span>
            <button class="code-copy-btn" onclick="copyCode('${codeId}')">複製代碼</button>
          </div>
          <pre><code id="${codeId}">${escapeHtml(code)}</code></pre>
        </div>`;
      });

      // 行內代碼
      html = html.replace(/`([^`]+)`/g, '<code style="background:#1e293b; padding:2px 5px; border-radius:4px; font-size:13px;">$1</code>');

      // 標題
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // 分隔線
      html = html.replace(/^---$/gim, '<hr/>');

      // 粗體與斜體
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // 無序清單
      html = html.replace(/^\s*[\-\*]\s+(.*$)/gim, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>)/gm, '<ul>$1</ul>');
      html = html.replace(/<\/ul>\s*<ul>/g, '');

      // 表格解析
      html = html.replace(/\|(.+)\|/g, function(match) {
        const cells = match.split('|').filter(c => c.trim() !== '');
        if (cells.some(c => c.includes('---'))) return '';
        const tds = cells.map(c => `<td>${c.trim()}</td>`).join('');
        return `<tr>${tds}</tr>`;
      });
      html = html.replace(/(<tr>[\s\S]*?<\/tr>)/gm, '<table>$1</table>');
      html = html.replace(/<\/table>\s*<table>/g, '');

      // 換行轉段落
      html = html.replace(/\n\n+/g, '</p><p>');
      html = '<p>' + html + '</p>';
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>(<h[1-3]>[\s\S]*?<\/h[1-3]>)<\/p>/g, '$1');
      html = html.replace(/<p>(<div class="code-container">[\s\S]*?<\/div>)<\/p>/g, '$1');
      html = html.replace(/<p>(<ul>[\s\S]*?<\/ul>)<\/p>/g, '$1');
      html = html.replace(/<p>(<table>[\s\S]*?<\/table>)<\/p>/g, '$1');
      html = html.replace(/<p>(<hr\/>)<\/p>/g, '$1');

      return html;
    }

    window.copyCode = function(id) {
      const el = document.getElementById(id);
      if (el) {
        navigator.clipboard.writeText(el.innerText).then(() => {
          alert("代碼已成功複製至剪貼簿！");
        });
      }
    };

    if (localStorage.getItem("saved_structured_prompt")) {
      sysPrompt.value = localStorage.getItem("saved_structured_prompt");
    }
    sysPrompt.addEventListener("change", () => {
      localStorage.setItem("saved_structured_prompt", sysPrompt.value);
    });

    // ================= 1. 安全沙盒延伸面板控制 =================
    window.togglePluginDrawer = function() {
      const isVisible = (pluginDrawer.style.display === "flex");
      if (!isVisible) {
        pluginDrawer.style.display = "flex";
        pluginToggleBtn.classList.add("btn-active");
        if (pluginFrame.src === "about:blank" || !pluginFrame.src) {
          loadPluginUrl();
        }
      } else {
        pluginDrawer.style.display = "none";
        pluginToggleBtn.classList.remove("btn-active");
      }
    };

    window.quickLoad = function(url) {
      drawerUrlInput.value = url;
      loadPluginUrl();
    };

    window.loadPluginUrl = function() {
      let targetUrl = drawerUrlInput.value.trim();
      if (!targetUrl) return;
      if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
        targetUrl = "https://" + targetUrl;
        drawerUrlInput.value = targetUrl;
      }
      pluginFrame.src = targetUrl;
    };

    window.popOutPlugin = function() {
      const targetUrl = drawerUrlInput.value.trim();
      if (targetUrl && targetUrl !== "about:blank") {
        window.open(targetUrl, "_blank", "noopener,noreferrer");
      }
    };

    // ================= 2. API Key 持久化保存 =================
    function initKeyStorage() {
      const storedKey = localStorage.getItem("app_vault_key");
      if (storedKey) {
        apiKeyInput.value = storedKey;
        memoryKey = storedKey;
        validateAndLoadModels(storedKey, false);
      }
    }

    async function validateAndSaveAPIKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        keyIndicator.style.background = "#64748b";
        keyIndicator.innerText = "未填入金鑰";
        keyMsg.innerText = "";
        localStorage.removeItem("app_vault_key");
        memoryKey = "";
        return false;
      }
      return await validateAndLoadModels(key, true);
    }
    window.validateAndSaveAPIKey = validateAndSaveAPIKey;

    async function validateAndLoadModels(key, showFeedback = true) {
      if (showFeedback) {
        keyIndicator.style.background = "#eab308";
        keyIndicator.innerText = "驗證中...";
      }
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": "Bearer " + key }
        });
        if (res.ok) {
          const data = await res.json();
          availableChatModels = (data.data || []).map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("distil"));
          keyIndicator.style.background = "var(--safe)";
          keyIndicator.innerText = "🟢 金鑰就緒";
          if (showFeedback) {
            keyMsg.style.color = "var(--safe)";
            keyMsg.innerText = "驗證通過，已持久記憶";
          }
          memoryKey = key;
          localStorage.setItem("app_vault_key", key);
          return true;
        } else {
          keyIndicator.style.background = "var(--danger)";
          keyIndicator.innerText = "🔴 金鑰無效";
          return false;
        }
      } catch (e) {
        keyIndicator.style.background = "var(--danger)";
        keyIndicator.innerText = "連線失敗";
        return false;
      }
    }

    function getOptimalModel() {
      if (availableChatModels.length === 0) return "llama-3.3-70b-versatile";
      const candidates = ["llama-3.3-70b-versatile", "llama-3.1-70b-versatile", "openai/gpt-oss-120b", "qwen/qwen3.8-27b"];
      return candidates.find(c => availableChatModels.includes(c)) || availableChatModels[0];
    }

    // ================= 3. 麥克風純用戶端手動觸發 =================
    let recognition = null;
    let isMicRecording = false;

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = "zh-TW";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        let finalStr = "";
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) finalStr += e.results[i][0].transcript;
        }
        if (finalStr) userInput.value += finalStr;
      };

      recognition.onerror = () => stopMicByUser();
      recognition.onend = () => stopMicByUser();
    }

    function startMicByUser() {
      if (!recognition) { alert("瀏覽器不支援語音輸入"); return; }
      try {
        recognition.start();
        isMicRecording = true;
        micBtn.classList.add("mic-active");
      } catch (e) {}
    }

    function stopMicByUser() {
      if (recognition && isMicRecording) recognition.stop();
      isMicRecording = false;
      micBtn.classList.remove("mic-active");
    }

    window.toggleVoice = function() {
      if (isMicRecording) stopMicByUser();
      else startMicByUser();
    };

    // ================= 4. 對話渲染與編輯重構機制 =================
    function appendMessage(role, text, index) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.index = index;

      const textSpan = document.createElement("div");
      textSpan.className = "bubble-text";
      if (role === "assistant") {
        textSpan.innerHTML = renderMarkdownToHtml(text);
      } else {
        textSpan.textContent = text;
      }
      div.appendChild(textSpan);

      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      if (role === "assistant") {
        const spkBtn = document.createElement("button");
        spkBtn.className = "tool-btn";
        spkBtn.textContent = "🔊 朗讀";
        spkBtn.onclick = () => speakText(textSpan.innerText);
        tools.appendChild(spkBtn);
      }

      if (role === "user") {
        const editRethinkBtn = document.createElement("button");
        editRethinkBtn.className = "tool-btn";
        editRethinkBtn.textContent = "✏️ 編輯並重新思考";
        editRethinkBtn.onclick = () => editAndRethinkMessage(index);
        tools.appendChild(editRethinkBtn);
      }

      const delBtn = document.createElement("button");
      delBtn.className = "tool-btn";
      delBtn.textContent = "🗑️ 刪除";
      delBtn.onclick = () => deleteMessage(index);
      tools.appendChild(delBtn);

      div.appendChild(tools);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { bubble: div, textSpan };
    }

    function renderAllMessages() {
      chatBox.textContent = "";
      conversation.forEach((msg, idx) => {
        appendMessage(msg.role, msg.content, idx);
      });
    }

    async function editAndRethinkMessage(index) {
      const current = conversation[index].content;
      const updated = prompt("修改提問內容並讓 AI 重新思考輸出：", current);
      if (updated !== null && updated.trim() !== "") {
        conversation = conversation.slice(0, index);
        userInput.value = updated.trim();
        sendMessage();
      }
    }

    function deleteMessage(index) {
      if (confirm("確定刪除此條記錄？")) {
        conversation.splice(index, 1);
        renderAllMessages();
      }
    }

    window.clearAllChat = function() {
      if (confirm("確定清空目前畫面的所有對話歷史？（金鑰與設定將完好保留）")) {
        conversation = [];
        chatBox.textContent = "";
      }
    };

    window.destroyAllMemory = function() {
      if (!confirm("確定要徹底抹除全部資料、對話、儲存的金鑰嗎？此操作不可逆！")) return;
      conversation = []; memoryKey = ""; apiKeyInput.value = "";
      localStorage.clear(); sessionStorage.clear(); chatBox.textContent = "";
      keyIndicator.style.background = "#64748b";
      keyIndicator.innerText = "已徹底銷毀";
      keyMsg.innerText = "";
      stopMicByUser();
      if (window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      alert("所有數據已徹底銷毀。");
    };

    // ================= 5. Zero-Latency 平滑流式推理解析發送 =================
    window.sendMessage = async function() {
      const rawText = userInput.value.trim();
      const key = memoryKey || apiKeyInput.value.trim();
      if (!rawText) return;
      if (!key) { alert("請在終端配置中填入有效的 Groq API Key！"); return; }

      stopMicByUser();

      const userIdx = conversation.length;
      conversation.push({ role: "user", content: rawText });
      appendMessage("user", rawText, userIdx);
      userInput.value = "";

      const aiIdx = conversation.length;
      const aiMsg = appendMessage("assistant", "", aiIdx);
      aiMsg.textSpan.innerHTML = '<span style="color:#60a5fa;">▍思考中...</span>';

      const now = new Date();
      const dateString = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const temporalContext = `【當前時空標籤】：今天是 ${dateString}。`;

      let fullSystemPrompt = `${sysPrompt.value}\n\n${temporalContext}\n\n【結構化指令】：
針對使用者的問題，展開完整、深度、具備邏輯層次的解析。
格式規範：
1. 【核心摘要】：精準定性問題背景與核心定調。
2. 【詳細剖析與關鍵要點】：使用 Markdown 標題、粗體與清單條理化展開。
3. 【整合洞見與評估】：總結關鍵結論與趨勢研判。`;

      const payloadMessages = [{ role: "system", content: fullSystemPrompt }, ...conversation.slice(-10)];
      const chosenModel = getOptimalModel();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: chosenModel, messages: payloadMessages, stream: true })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || ("伺服器錯誤狀態: " + response.status));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        let isRendering = false;

        // 流式渲染節奏調優：結合 requestAnimationFrame 消除掉幀卡頓
        function scheduleStreamRender() {
          if (!isRendering) {
            isRendering = true;
            requestAnimationFrame(() => {
              aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply) + '<span style="color:#60a5fa; animation: blink 1s infinite;">▍</span>';
              chatBox.scrollTop = chatBox.scrollHeight;
              isRendering = false;
            });
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                const token = parsed.choices[0].delta?.content || "";
                fullReply += token;
                scheduleStreamRender();
              } catch (e) {}
            }
          }
        }

        // 串流結束，移除閃爍游標並執行最終格式重繪
        aiMsg.textSpan.innerHTML = renderMarkdownToHtml(fullReply);
        conversation.push({ role: "assistant", content: fullReply });
        renderAllMessages();

        if (autoSpeakCheck.checked) speakText(aiMsg.textSpan.innerText);

      } catch (err) {
        aiMsg.textSpan.innerHTML = '<span style="color:var(--danger);">出錯了: ' + err.message + '</span>';
        conversation.pop();
      }
    };

    // ================= 6. TTS 朗讀 =================
    let synth = window.speechSynthesis;
    let voices = [];
    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices();
      voiceSelect.textContent = "";
      const zhVoices = voices.filter(v => v.lang.includes("zh") || v.lang.includes("cmn"));
      (zhVoices.length > 0 ? zhVoices : voices).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speakText(text) {
      if (!synth || !text) return;
      if (synth.speaking) synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = parseFloat(ttsRate.value);
      const selected = voices.find(v => v.name === voiceSelect.value);
      if (selected) utter.voice = selected;
      else utter.lang = "zh-TW";
      synth.speak(utter);
    }

    // ================= 7. 更新與配置開合 =================
    window.checkCodeUpdate = async function() {
      try {
        const currentUrl = window.location.href.split('?')[0];
        const res = await fetch(`${currentUrl}?_t=${Date.now()}`, { cache: "no-store" });
        if (res.ok && confirm("已連線確認！是否立即重新載入最新版本？（金鑰與設定將完好保留）")) {
          window.location.reload(true);
        }
      } catch (e) { alert("檢查失敗，請確認網路連線。"); }
    };

    window.toggleSettings = function() {
      const p = document.getElementById("settings-panel");
      p.style.display = (p.style.display === "flex") ? "none" : "flex";
    };

    // 核心限制：完全停用 Enter 發送，純粹作為換行
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        return;
      }
    });

    initKeyStorage();
  })();
</script>
