<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>輕量 AI 終端</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #3b82f6;
      --user: #2563eb;
      --ai: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 12px 16px;
      background: var(--card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
      gap: 8px;
    }
    .config-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button, textarea {
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      padding: 6px 10px;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: var(--user); color: #fff; }
    .assistant { align-self: flex-start; background: var(--ai); color: #e2e8f0; }
    footer {
      padding: 12px;
      background: var(--card);
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    textarea { flex: 1; resize: none; height: 42px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 16px;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<header>
  <strong>輕量 AI 終端</strong>
  <div class="config-inputs">
    <input id="apiKey" type="password" placeholder="輸入 Groq Key (gsk_...)" />
    <select id="modelSelect">
      <option value="">載入模型中...</option>
    </select>
    <button onclick="clearHistory()">清除對話</button>
  </div>
</header>

<main id="chat-box"></main>

<footer>
  <textarea id="userInput" placeholder="輸入訊息... (Enter 發送, Shift+Enter 換行)"></textarea>
  <button id="sendBtn" onclick="sendMessage()">發送</button>
</footer>

<script>
  let conversation = [
    { role: "system", content: "你是一位精煉、樂於助人且具備清晰推理邏輯的繁體中文 AI 助理。" }
  ];

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("userInput");
  const apiKeyInput = document.getElementById("apiKey");
  const modelSelect = document.getElementById("modelSelect");

  if (localStorage.getItem("ai_api_key")) {
    apiKeyInput.value = localStorage.getItem("ai_api_key");
    fetchModels(apiKeyInput.value.trim());
  }

  apiKeyInput.addEventListener("change", () => {
    const key = apiKeyInput.value.trim();
    localStorage.setItem("ai_api_key", key);
    if (key) fetchModels(key);
  });

  // 自動向伺服器查詢該金鑰真正有權限的模型清單
  async function fetchModels(key) {
    if (!key) return;
    try {
      const res = await fetch("https://api.groq.com/openai/v1/models", {
        headers: { "Authorization": `Bearer ${key}` }
      });
      const data = await res.json();
      if (data && data.data) {
        modelSelect.innerHTML = "";
        // 排除 whisper 音訊辨識模型，只留文字聊天模型
        const chatModels = data.data.filter(m => !m.id.includes("whisper"));
        chatModels.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.innerText = m.id;
          modelSelect.appendChild(opt);
        });
      }
    } catch (e) {
      console.error("載入模型清單失敗", e);
    }
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    const key = apiKeyInput.value.trim();
    const selectedModel = modelSelect.value;

    if (!text) return;
    if (!key) {
      alert("請在右上角貼上 Groq API Key（以 gsk_ 開頭）！");
      return;
    }
    if (!selectedModel) {
      alert("正在載入可用模型清單，請稍等兩秒再試一次！");
      return;
    }

    appendMessage("user", text);
    conversation.push({ role: "user", content: text });
    userInput.value = "";

    const loadingBubble = appendMessage("assistant", "思考中...");

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${key}`
        },
        body: JSON.stringify({
          model: selectedModel,
          messages: conversation
        })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error ? data.error.message : "伺服器無回應");
      }

      const reply = data.choices[0].message.content;
      loadingBubble.innerText = reply;
      conversation.push({ role: "assistant", content: reply });
    } catch (err) {
      loadingBubble.innerText = "出錯了: " + err.message;
      conversation.pop();
    }
  }

  function clearHistory() {
    conversation = [
      { role: "system", content: "你是一位精煉、樂於助人且具備清晰推理邏輯的繁體中文 AI 助理。" }
    ];
    chatBox.innerHTML = "";
    appendMessage("assistant", "對話已重置。");
  }

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
