<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Gemini Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --keyboard-offset: 0px; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f8fafc;
    }
    #app-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--keyboard-offset);
      transition: padding-bottom 0.1s ease-out;
    }
    .gemini-card-shadow {
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.06);
    }
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      vertical-align: baseline;
      animation: blink 1s infinite;
      color: #3b82f6;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased select-none md:select-auto">

  <div id="app-container">
    <!-- 頂部狀態列 -->
    <header class="flex items-center justify-between px-4 py-2.5 bg-white border-b border-slate-200 shrink-0">
      <div class="flex items-center space-x-2">
        <span class="font-semibold text-base tracking-tight text-slate-800 flex items-center gap-1.5">
          <i data-lucide="sparkle" class="w-5 h-5 text-blue-600 fill-blue-600"></i> Gemini Canvas
        </span>
        <div id="net-status" class="flex items-center text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
          <span id="net-text">連線良好</span>
        </div>
      </div>
      
      <div class="flex items-center space-x-1">
        <button onclick="checkConnection()" title="重新整理" class="p-2 rounded-full hover:bg-slate-100 text-slate-500">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleSettingsModal(true)" class="p-2 rounded-full hover:bg-slate-100 text-slate-500">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- 對話主區域 -->
    <main class="flex-1 overflow-y-auto px-4 py-4 max-w-3xl w-full mx-auto space-y-5" id="chat-stream">
      <div class="flex items-start space-x-3">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-sm">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200/80 shadow-sm leading-relaxed max-w-[85%] text-sm text-slate-700">
          你好！點擊右上角設定 <i data-lucide="settings" class="inline w-3.5 h-3.5"></i> 填入 Google 或 OpenRouter 金鑰後即可開始。
        </div>
      </div>
    </main>

    <!-- 底部輸入區 -->
    <footer class="p-3 max-w-3xl w-full mx-auto shrink-0">
      <div class="bg-white rounded-3xl border border-slate-200 p-2.5 gemini-card-shadow flex flex-col space-y-2">
        
        <div id="context-anchor-bar" class="hidden items-center justify-between text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-xl">
          <div class="flex items-center space-x-1 truncate">
            <i data-lucide="pin" class="w-3 h-3 shrink-0"></i>
            <span id="anchor-preview" class="truncate">鎖定特徵已啟用</span>
          </div>
          <button onclick="clearAnchor()" class="text-slate-400 hover:text-rose-500">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <div class="flex items-end space-x-1.5">
          <textarea 
            id="user-input" 
            rows="1" 
            placeholder="輸入訊息，可重新編輯思考..." 
            class="flex-1 max-h-32 resize-none bg-transparent outline-none px-2 py-1 text-slate-800 text-sm leading-6"
            oninput="autoResize(this)"></textarea>
          
          <label class="cursor-pointer p-2 rounded-full hover:bg-slate-100 text-slate-500 shrink-0">
            <i data-lucide="paperclip" class="w-4 h-4"></i>
            <input type="file" id="file-uploader" class="hidden" onchange="handleFileUpload(event)" multiple />
          </label>

          <button id="mic-btn" onclick="toggleSpeechRecognition()" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 shrink-0">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>

          <button id="send-btn" onclick="sendMessage()" class="p-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white shrink-0 shadow">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center justify-between pt-1 border-t border-slate-100 text-xs">
          <select id="mode-select" class="bg-slate-50 rounded-lg px-2 py-1 outline-none text-slate-600 font-medium">
            <option value="concise">⚡ 快速精簡 (最省流量)</option>
            <option value="in_depth" selected>🔬 深入研究 (結構詳解)</option>
            <option value="storyteller">📖 小說世界觀 (豐富細節)</option>
          </select>
          <button onclick="exportChat()" class="text-slate-400 hover:text-slate-700 flex items-center space-x-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i><span>匯出記錄</span>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- 設定與金鑰面板 -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800">金鑰設定</h3>
        <button onclick="toggleSettingsModal(false)" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-600 flex justify-between">
          <span>API Key</span>
          <span id="key-badge" class="text-[10px] px-1.5 py-0.5 rounded hidden"></span>
        </label>
        <input type="password" id="api-key" placeholder="貼上 AIzaSy... 開頭的金鑰" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-blue-500" />
        <div id="key-feedback" class="text-[11px] text-slate-400">支援 Google AI Studio 或 OpenRouter。</div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-600">全局記憶點 (偏好與設定)</label>
        <textarea id="core-memories" rows="2" placeholder="例如：偏好深入探討、理性與感性兼具..." class="w-full border border-slate-200 rounded-xl p-2 text-xs outline-none"></textarea>
      </div>

      <div class="flex space-x-2 pt-1">
        <button id="direct-save-btn" onclick="directSaveKey()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-xl text-xs transition">
          直接儲存
        </button>
        <button id="validate-btn" onclick="validateAndSaveKey()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-xl text-xs transition">
          在線驗證並存
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let chatHistory = [];
    let anchoredContext = "";
    let recognition = null;
    let isRecording = false;

    function setupViewportAdjustment() {
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          const offset = window.innerHeight - window.visualViewport.height;
          document.documentElement.style.setProperty('--keyboard-offset', `${Math.max(0, offset)}px`);
          scrollChatToBottom();
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupViewportAdjustment();
      loadSettings();
      checkConnection();
      initSpeech();
    });

    function scrollChatToBottom() {
      const stream = document.getElementById('chat-stream');
      stream.scrollTop = stream.scrollHeight;
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function loadSettings() {
      const savedKey = localStorage.getItem('omni_ai_key');
      const savedMem = localStorage.getItem('omni_ai_memories');

      if (savedKey) {
        try {
          document.getElementById('api-key').value = atob(savedKey);
          updateKeyStatusBadge(true, '已儲存金鑰');
        } catch(e) {}
      }
      if (savedMem) document.getElementById('core-memories').value = savedMem;
    }

    // 直接儲存金鑰（跳過驗證）
    function directSaveKey() {
      const key = document.getElementById('api-key').value.trim();
      if (!key) return alert('請先輸入金鑰');
      localStorage.setItem('omni_ai_key', btoa(key));
      localStorage.setItem('omni_ai_memories', document.getElementById('core-memories').value.trim());
      updateKeyStatusBadge(true, '已直接儲存');
      toggleSettingsModal(false);
      alert('金鑰已儲存！請直接在下方發送訊息測試。');
    }

    // 嚴格在線驗證
    async function validateAndSaveKey() {
      const key = document.getElementById('api-key').value.trim();
      const feedback = document.getElementById('key-feedback');
      const btn = document.getElementById('validate-btn');

      if (!key) {
        feedback.className = "text-[11px] text-rose-500";
        feedback.innerText = "請先貼入 API Key";
        return;
      }

      btn.disabled = true;
      btn.innerText = "驗證中...";
      feedback.className = "text-[11px] text-blue-600";
      feedback.innerText = "正在連線測試金鑰...";

      const isGoogle = key.startsWith("AIzaSy");

      try {
        let isValid = false;
        let errorDetail = "";

        if (isGoogle) {
          // 向 Google 發送一次極小的測試請求（測試 1.5-flash）
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: "hi" }] }]
            })
          });
          if (res.ok) {
            isValid = true;
          } else {
            const errData = await res.json().catch(() => ({}));
            errorDetail = errData.error?.message || `HTTP ${res.status}`;
          }
        } else {
          // OpenRouter 驗證
          const res = await fetch('https://openrouter.ai/api/v1/auth/key', {
            headers: { 'Authorization': `Bearer ${key}` }
          });
          isValid = res.ok;
          if (!isValid) errorDetail = `HTTP ${res.status}`;
        }

        if (isValid) {
          localStorage.setItem('omni_ai_key', btoa(key));
          localStorage.setItem('omni_ai_memories', document.getElementById('core-memories').value.trim());
          
          updateKeyStatusBadge(true, isGoogle ? 'Google Key 有效' : 'OpenRouter 有效');
          feedback.className = "text-[11px] text-emerald-600";
          feedback.innerText = "驗證成功！金鑰已可用。";
          setTimeout(() => toggleSettingsModal(false), 800);
        } else {
          updateKeyStatusBadge(false, '驗證失敗');
          feedback.className = "text-[11px] text-rose-600";
          feedback.innerText = `失敗: ${errorDetail || '金鑰不正確'}。若確認無誤可點「直接儲存」。`;
        }
      } catch (e) {
        feedback.className = "text-[11px] text-rose-600";
        feedback.innerText = "連線受阻，建議直接點選「直接儲存」後發送訊息。";
      } finally {
        btn.disabled = false;
        btn.innerText = "在線驗證並存";
      }
    }

    function updateKeyStatusBadge(valid, text) {
      const badge = document.getElementById('key-badge');
      badge.classList.remove('hidden');
      badge.innerText = text;
      badge.className = valid 
        ? "text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700"
        : "text-[10px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-700";
    }

    function toggleSettingsModal(show) {
      document.getElementById('settings-modal').classList.toggle('hidden', !show);
    }

    function checkConnection() {
      const netText = document.getElementById('net-text');
      const netBox = document.getElementById('net-status');
      if (navigator.onLine) {
        netText.textContent = '連線良好';
        netBox.className = 'flex items-center text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full';
      } else {
        netText.textContent = '離線中';
        netBox.className = 'flex items-center text-xs text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full';
      }
    }
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);

    // 發送訊息（優先調用支援度最廣的 gemini-1.5-flash / gemini-2.0-flash）
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const prompt = inputEl.value.trim();
      const rawKey = localStorage.getItem('omni_ai_key');
      const apiKey = rawKey ? atob(rawKey).trim() : '';

      if (!prompt) return;
      if (!apiKey) {
        alert('請先點選右上角設定輸入 API Key');
        toggleSettingsModal(true);
        return;
      }

      appendMessage('user', prompt);
      inputEl.value = '';
      autoResize(inputEl);

      const mode = document.getElementById('mode-select').value;
      const memory = localStorage.getItem('omni_ai_memories') || '';

      let systemPrompt = `你是一個專業助手。記憶點：${memory}。`;
      if (anchoredContext) systemPrompt += `\n[保持原樣特徵]: ${anchoredContext}`;
      if (mode === 'concise') systemPrompt += "\n限制: 極簡答覆，提取重點。";
      else if (mode === 'in_depth') systemPrompt += "\n風格: 深入探討、理性與感性兼具、結構詳盡。";
      else if (mode === 'storyteller') systemPrompt += "\n風格: 小說敘事，情感充沛。";

      const botCard = appendMessage('bot', '');
      const contentEl = botCard.querySelector('.content-body');
      contentEl.classList.add('typing-cursor');

      const isGoogle = apiKey.startsWith("AIzaSy");

      try {
        let fullReply = "";

        if (isGoogle) {
          // Google 官方穩定通道（使用 gemini-1.5-flash）
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
          
          const payload = {
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: [
              ...chatHistory.slice(-4).map(m => ({
                role: m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.text }]
              })),
              { role: "user", parts: [{ text: prompt }] }
            ]
          };

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error?.message || `HTTP ${res.status}`);
          }

          fullReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "無回覆內容。";
          contentEl.innerHTML = fullReply.replace(/\n/g, '<br/>');

        } else {
          // OpenRouter 通道
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'google/gemini-2.0-flash-exp:free',
              messages: [
                { role: "system", content: systemPrompt },
                ...chatHistory.slice(-4).map(m => ({ role: m.role, content: m.text })),
                { role: "user", content: prompt }
              ]
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
          fullReply = data.choices?.[0]?.message?.content || "無回覆內容。";
          contentEl.innerHTML = fullReply.replace(/\n/g, '<br/>');
        }

        contentEl.classList.remove('typing-cursor');
        chatHistory.push({ role: 'user', text: prompt }, { role: 'assistant', text: fullReply });
        attachActionButtons(botCard, fullReply);
        scrollChatToBottom();

      } catch (err) {
        contentEl.classList.remove('typing-cursor');
        contentEl.innerHTML = `<span class="text-rose-500 font-medium">請求失敗：${err.message}</span>`;
      }
    }

    function appendMessage(role, text) {
      const stream = document.getElementById('chat-stream');
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end' : 'flex items-start space-x-3';

      if (role === 'user') {
        wrapper.innerHTML = `
          <div class="flex flex-col items-end space-y-1 max-w-[85%]">
            <div class="bg-blue-600 text-white p-3.5 rounded-2xl rounded-tr-none text-sm leading-relaxed">${text}</div>
            <button onclick="editPrompt('${encodeURIComponent(text)}')" class="text-xs text-slate-400 hover:text-blue-600 flex items-center space-x-1">
              <i data-lucide="edit-3" class="w-3 h-3"></i><span>編輯重發</span>
            </button>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-sm">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200/80 shadow-sm leading-relaxed max-w-[85%] space-y-2">
            <div class="content-body text-sm text-slate-700">${text}</div>
            <div class="action-buttons pt-2 border-t border-slate-50 flex items-center space-x-3 text-xs text-slate-400"></div>
          </div>
        `;
      }

      stream.appendChild(wrapper);
      scrollChatToBottom();
      lucide.createIcons();
      return wrapper;
    }

    function editPrompt(encodedText) {
      const text = decodeURIComponent(encodedText);
      const input = document.getElementById('user-input');
      input.value = text;
      input.focus();
      autoResize(input);
    }

    function attachActionButtons(botMsgDiv, text) {
      const container = botMsgDiv.querySelector('.action-buttons');
      container.innerHTML = `
        <button onclick="speakText('${encodeURIComponent(text)}')" class="hover:text-slate-700 flex items-center space-x-1">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i><span>朗讀</span>
        </button>
        <button onclick="anchorForDerivation('${encodeURIComponent(text)}')" class="hover:text-indigo-600 flex items-center space-x-1">
          <i data-lucide="copy-plus" class="w-3.5 h-3.5"></i><span>鎖定為前作衍生</span>
        </button>
      `;
      lucide.createIcons();
    }

    function anchorForDerivation(encodedText) {
      anchoredContext = decodeURIComponent(encodedText);
      const bar = document.getElementById('context-anchor-bar');
      const preview = document.getElementById('anchor-preview');
      preview.textContent = `鎖定前作：${anchoredContext.slice(0, 24)}...`;
      bar.classList.remove('hidden');
      bar.classList.add('flex');
    }

    function clearAnchor() {
      anchoredContext = "";
      document.getElementById('context-anchor-bar').classList.add('hidden');
    }

    function initSpeech() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.lang = 'zh-TW';
        recognition.onresult = (e) => {
          document.getElementById('user-input').value = e.results[0][0].transcript;
          autoResize(document.getElementById('user-input'));
          toggleSpeechRecognition(false);
        };
        recognition.onerror = () => toggleSpeechRecognition(false);
      }
    }

    function toggleSpeechRecognition(force) {
      if (!recognition) return alert('瀏覽器不支援語音辨識');
      const btn = document.getElementById('mic-btn');
      if (isRecording || force === false) {
        recognition.stop();
        isRecording = false;
        btn.classList.remove('text-rose-500', 'animate-pulse');
      } else {
        recognition.start();
        isRecording = true;
        btn.classList.add('text-rose-500', 'animate-pulse');
      }
    }

    function speakText(text) {
      if (!'speechSynthesis' in window) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(decodeURIComponent(text));
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }

    function handleFileUpload(e) {
      const files = e.target.files;
      if (!files.length) return;
      document.getElementById('user-input').value += `\n[附加檔案: ${Array.from(files).map(f => f.name).join(', ')}]`;
      autoResize(document.getElementById('user-input'));
    }

    function exportChat() {
      const blob = new Blob([JSON.stringify(chatHistory, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Gemini_Chat_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
