<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專業輕量 AI 終端</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --user: #2563eb;
      --ai: #334155;
      --border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #16a34a;
      color: #fff;
    }
    .status-badge.offline { background: #dc2626; }
    .panel-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
    }
    #settings-panel {
      display: none;
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      gap: 12px;
      flex-direction: column;
      font-size: 13px;
    }
    .panel-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .panel-row label { min-width: 90px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      padding: 6px 10px;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }
    .user { align-self: flex-end; background: var(--user); color: #fff; }
    .assistant { align-self: flex-start; background: var(--ai); color: #e2e8f0; }
    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
      gap: 6px;
    }
    .speak-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 4px;
    }
    .speak-btn:hover { color: #fff; border-color: var(--accent); }
    footer {
      padding: 10px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { flex: 1; resize: none; height: 44px; }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 14px;
      height: 44px;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .recording { background: #dc2626 !important; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong>輕量 AI 終端</strong>
    <span id="net-status" class="status-badge">在線</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="panel-toggle" onclick="toggleSettings()">參數與記憶庫</button>
    <button class="panel-toggle" onclick="clearHistory()">清除對話</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>API Key:</label>
    <input id="apiKey" type="password" placeholder="Groq API Key (gsk_...)" style="flex:1;" />
    <label>模型清單:</label>
    <select id="modelSelect" style="max-width:350px;">
      <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile - 載入中...</option>
    </select>
  </div>
  <div class="panel-row">
    <label>溫度 (隨機性):</label>
    <input id="tempRange" type="range" min="0" max="1" step="0.05" value="0.7" oninput="tempVal.innerText = this.value" />
    <span id="tempVal">0.7</span>
    <label style="margin-left:12px;">上下文截斷:</label>
    <select id="windowSelect">
      <option value="6">保留最新 6 輪對話</option>
      <option value="12" selected>保留最新 12 輪對話</option>
      <option value="20">保留最新 20 輪對話</option>
    </select>
  </div>
  <div class="panel-row" style="background:#0f172a; padding:8px; border-radius:6px;">
    <label>語音朗讀設定:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 自動朗讀回覆</label>
    <span style="margin-left:10px;">語速:</span>
    <input id="ttsRate" type="range" min="0.5" max="2" step="0.1" value="1.0" oninput="rateVal.innerText = this.value" />
    <span id="rateVal">1.0</span>
    <span style="margin-left:10px;">語氣音調:</span>
    <input id="ttsPitch" type="range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="pitchVal.innerText = this.value" />
    <span id="pitchVal">1.0</span>
    <span style="margin-left:10px;">聲音:</span>
    <select id="voiceSelect" style="max-width:180px;"><option value="">預設中文語音</option></select>
  </div>
  <div class="panel-row">
    <label>人設 (System):</label>
    <input id="sysPrompt" type="text" value="你是一位精準、樂於助人且具備清晰邏輯思維的繁體中文 AI 助理。" style="flex:1;" />
  </div>
  <div class="panel-row">
    <label>持久常駐檔案:</label>
    <input type="file" id="fileInput" accept=".txt,.md,.json,.csv" />
    <span id="fileMemoryInfo" style="color:var(--muted);">尚未匯入常駐文件</span>
  </div>
</section>

<main id="chat-box"></main>

<footer>
  <div class="input-bar">
    <button class="icon-btn" id="micBtn" title="手動開關麥克風語音輸入" onclick="toggleVoice()">🎙️</button>
    <textarea id="userInput" placeholder="輸入訊息... (Enter 發送, Shift+Enter 換行)"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
</footer>

<script>
  let conversation = [];
  let permanentContext = "";

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("userInput");
  const apiKeyInput = document.getElementById("apiKey");
  const modelSelect = document.getElementById("modelSelect");
  const tempRange = document.getElementById("tempRange");
  const sysPrompt = document.getElementById("sysPrompt");
  const windowSelect = document.getElementById("windowSelect");
  const netStatus = document.getElementById("net-status");
  const micBtn = document.getElementById("micBtn");
  const fileMemoryInfo = document.getElementById("fileMemoryInfo");
  const autoSpeakCheck = document.getElementById("autoSpeakCheck");
  const ttsRate = document.getElementById("ttsRate");
  const ttsPitch = document.getElementById("ttsPitch");
  const voiceSelect = document.getElementById("voiceSelect");

  // 模型領域標籤字典
  const MODEL_TAGS = {
    "llama-3.3-70b-versatile": "【旗艦推薦】複雜邏輯 / 長文寫作 / 繁中優質",
    "llama-3.1-8b-instant": "【極速對話】低延遲 / 簡易問答",
    "openai/gpt-oss-120b": "【深度推導】高難度邏輯 / 代碼開發",
    "openai/gpt-oss-20b": "【平衡高效】超高推論速度",
    "qwen/qwen3.8-27b": "【中文專精】在地語感 / 文學創作"
  };

  // 1. 自動向伺服器拉取可用模型清單
  async function fetchModels(key) {
    if (!key) return;
    try {
      const res = await fetch("https://api.groq.com/openai/v1/models", {
        headers: { "Authorization": "Bearer " + key }
      });
      const data = await res.json();
      if (data && data.data) {
        modelSelect.innerHTML = "";
        const chatModels = data.data.filter(m => 
          !m.id.includes("whisper") && 
          !m.id.includes("guard") && 
          !m.id.includes("distil")
        );

        chatModels.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.id;
          const desc = MODEL_TAGS[m.id] ? ` - ${MODEL_TAGS[m.id]}` : "";
          opt.innerText = `${m.id}${desc}`;
          if (m.id === "llama-3.3-70b-versatile") opt.selected = true;
          modelSelect.appendChild(opt);
        });
      }
    } catch (e) {
      console.error("載入模型清單失敗", e);
    }
  }

  // 讀取本地儲存
  if (localStorage.getItem("ai_api_key")) {
    apiKeyInput.value = localStorage.getItem("ai_api_key");
    fetchModels(apiKeyInput.value.trim());
  }
  if (localStorage.getItem("ai_perm_memory")) {
    permanentContext = localStorage.getItem("ai_perm_memory");
    fileMemoryInfo.innerText = "已加載持久記憶 (" + permanentContext.length + " 字)";
  }
  apiKeyInput.addEventListener("change", () => {
    const key = apiKeyInput.value.trim();
    localStorage.setItem("ai_api_key", key);
    if (key) fetchModels(key);
  });

  // 2. 網路狀態監測
  function updateOnlineStatus() {
    if (navigator.onLine) {
      netStatus.className = "status-badge";
      netStatus.innerText = "在線";
    } else {
      netStatus.className = "status-badge offline";
      netStatus.innerText = "離線中";
    }
  }
  window.addEventListener("online", updateOnlineStatus);
  window.addEventListener("offline", updateOnlineStatus);

  // 3. 常駐記憶文件加載
  document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      permanentContext = evt.target.result.slice(0, 8000);
      localStorage.setItem("ai_perm_memory", permanentContext);
      fileMemoryInfo.innerText = `已綁定記憶：${file.name} (${permanentContext.length} 字)`;
      alert(`文件「${file.name}」已寫入常駐記憶，清除對話亦不會遺忘！`);
    };
    reader.readAsText(file);
  });

  function toggleSettings() {
    const p = document.getElementById("settings-panel");
    p.style.display = (p.style.display === "flex") ? "none" : "flex";
  }

  // 4. 語音合成（朗讀字幕功能）
  let synth = window.speechSynthesis;
  let voices = [];

  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices().filter(v => v.lang.includes("zh") || v.lang.includes("cmn"));
    voiceSelect.innerHTML = "";
    voices.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v.name;
      opt.innerText = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
    });
    if (voices.length === 0) {
      voiceSelect.innerHTML = '<option value="">系統預設中文</option>';
    }
  }
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  loadVoices();

  function speakText(text) {
    if (!synth) return;
    if (synth.speaking) synth.cancel();
    if (!text) return;

    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = parseFloat(ttsRate.value);
    utter.pitch = parseFloat(ttsPitch.value);

    const selectedVoice = voices.find(v => v.name === voiceSelect.value);
    if (selectedVoice) utter.voice = selectedVoice;
    else utter.lang = "zh-TW";

    synth.speak(utter);
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    
    const textNode = document.createElement("span");
    textNode.innerText = text;
    div.appendChild(textNode);

    // AI 回覆加上朗讀控制按鈕
    if (role === "assistant") {
      const actions = document.createElement("div");
      actions.className = "bubble-actions";
      const spkBtn = document.createElement("button");
      spkBtn.className = "speak-btn";
      spkBtn.innerText = "🔊 朗讀";
      spkBtn.onclick = () => speakText(textNode.innerText);
      actions.appendChild(spkBtn);
      div.appendChild(actions);
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return { bubble: div, textSpan: textNode };
  }

  // 5. 串流發送對話
  async function sendMessage() {
    const text = userInput.value.trim();
    const key = apiKeyInput.value.trim();
    if (!text) return;
    if (!key) { alert("請先於設定面板填入 Groq API Key！"); return; }
    if (!navigator.onLine) { alert("目前網路處於離線狀態，請確認連線。"); return; }

    appendMessage("user", text);
    conversation.push({ role: "user", content: text });
    userInput.value = "";

    const maxTurns = parseInt(windowSelect.value, 10);
    let trimmedHistory = conversation.slice(-maxTurns);

    let fullSystemPrompt = sysPrompt.value;
    if (permanentContext) {
      fullSystemPrompt += "\n\n【用戶常駐記憶資料】：\n" + permanentContext;
    }

    const payloadMessages = [
      { role: "system", content: fullSystemPrompt },
      ...trimmedHistory
    ];

    const aiMsg = appendMessage("assistant", "");
    aiMsg.textSpan.innerText = "▍";

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: payloadMessages,
          temperature: parseFloat(tempRange.value),
          stream: true
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error ? errData.error.message : "伺服器無回應");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let fullReply = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split("\n");

        for (const line of lines) {
          if (line.startsWith("data: ") && line !== "data: [DONE]") {
            try {
              const parsed = JSON.parse(line.replace("data: ", ""));
              const token = parsed.choices[0].delta?.content || "";
              fullReply += token;
              aiMsg.textSpan.innerText = fullReply + "▍";
              chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {}
          }
        }
      }

      aiMsg.textSpan.innerText = fullReply;
      conversation.push({ role: "assistant", content: fullReply });

      // 若勾選自動朗讀，生成完畢即刻唸出
      if (autoSpeakCheck.checked) {
        speakText(fullReply);
      }

    } catch (err) {
      aiMsg.textSpan.innerText = "出錯了: " + err.message;
      conversation.pop();
    }
  }

  // 6. 手動麥克風語音輸入 (Web Speech API)
  let recognition = null;
  let isRecording = false;

  if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = "zh-TW";
    recognition.continuous = true; // 持續收音，直到手動關閉
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          userInput.value += event.results[i][0].transcript;
        }
      }
    };

    recognition.onerror = () => stopRecording();
    recognition.onend = () => { if (isRecording) stopRecording(); };
  }

  function startRecording() {
    if (!recognition) {
      alert("此瀏覽器不支援語音辨識，請使用 Chrome 或 Safari。");
      return;
    }
    recognition.start();
    isRecording = true;
    micBtn.classList.add("recording");
    micBtn.title = "正在錄音... 再次點擊以停止";
  }

  function stopRecording() {
    if (recognition && isRecording) {
      recognition.stop();
    }
    isRecording = false;
    micBtn.classList.remove("recording");
    micBtn.title = "手動開關麥克風語音輸入";
  }

  function toggleVoice() {
    if (isRecording) stopRecording();
    else startRecording();
  }

  function clearHistory() {
    if (synth && synth.speaking) synth.cancel();
    conversation = [];
    chatBox.innerHTML = "";
    appendMessage("assistant", "對話紀錄已清空。（常駐文件檔案記憶依然保留）");
  }

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
