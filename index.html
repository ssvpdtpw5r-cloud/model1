<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 防追蹤：杜絕向任何第三方洩漏來源 Referrer -->
  <meta name="referrer" content="no-referrer" />
  <!-- 嚴格 CSP：禁止未授權腳本注入，僅允許特定白名單通訊，杜絕廣告與外聯遙測 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src https://api.groq.com https://zh.wikipedia.org https://api.duckduckgo.com; img-src 'self' data:; frame-ancestors 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>專業高安全防護 AI 鑑識工作終端</title>
  <style>
    :root {
      --bg: #070a12;
      --card: #0f1626;
      --panel: #0a101d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user: #1d4ed8;
      --ai: #131d31;
      --border: #1e293b;
      --danger: #ef4444;
      --safe: #10b981;
      --fact: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
    header {
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--safe);
      color: #fff;
    }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #1a253a; border-color: var(--accent); }
    .btn-active { background: var(--accent) !important; color: #fff; border-color: var(--accent); }
    .danger-btn { border-color: var(--danger); color: #fca5a5; }

    #settings-panel {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      gap: 10px;
      flex-direction: column;
      font-size: 13px;
      max-height: 55vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel-row label { min-width: 85px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #070a12;
      color: var(--text);
      padding: 6px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      contain: layout;
    }
    .bubble {
      max-width: 88%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .user { align-self: flex-end; background: var(--user); color: #fff; }
    .assistant { 
      align-self: flex-start; 
      background: var(--ai); 
      color: #e2e8f0; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .bubble-tools {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tool-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

    footer {
      padding: 10px 14px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { 
      flex: 1; 
      resize: none; 
      height: 46px; 
      line-height: 22px; 
      padding: 10px 12px; 
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 18px;
      height: 46px;
      white-space: nowrap;
    }
    
    /* 物理級麥克風硬體狀態指示燈按鈕（純用戶端觸發） */
    .mic-button-container {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 8px;
      position: relative;
    }
    /* 紅綠狀態指示燈 */
    .mic-indicator-led {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger); /* 預設紅色：關閉 */
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
      pointer-events: none;
    }
    .mic-active .mic-indicator-led {
      background: var(--safe); /* 綠色：使用中 */
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
      animation: pulse-led 1s infinite;
    }
    .mic-active {
      border-color: var(--safe) !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }
    @keyframes pulse-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong style="color:#60a5fa;">高安全 AI 鑑識工作終端</strong>
    <span id="key-indicator" class="status-badge" style="background:#64748b;">檢測中...</span>
    <span id="tamper-guard" style="font-size:11px; color:var(--safe);">🔒 記憶體沙盒受保護</span>
  </div>
  <div style="display:flex; gap:6px;">
    <!-- 更新無需輸入 API Key -->
    <button class="btn" onclick="checkCodeUpdate()">🔄 檢查更新</button>
    <button class="btn" onclick="toggleSettings()">⚙️ 終端配置</button>
    <button class="btn danger-btn" onclick="destroyAllMemory()">銷毀記錄</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>Groq Key:</label>
    <input id="apiKey" type="password" placeholder="貼上 gsk_... 金鑰 (輸入後自動記憶)" style="flex:1; min-width:180px;" onchange="validateAndSaveAPIKey()" autocomplete="off" />
    <button class="btn" onclick="validateAndSaveAPIKey()">測試並保存</button>
    <span id="key-msg" style="font-size:12px;"></span>
  </div>

  <div class="panel-row">
    <label>人設模板:</label>
    <select id="presetPromptSelect" onchange="applyPresetPrompt()" style="flex:1; min-width:200px;">
      <option value="fact_checker">🔍 客觀事實查核員（公信力優先、繁中邏輯梳理）</option>
      <option value="research_analyst">📊 深度數據研究員（長文脈絡、因果推導）</option>
      <option value="custom">✍️ 完全自定義人設</option>
    </select>
  </div>

  <div class="panel-row">
    <label style="color:#60a5fa;">System Prompt:</label>
    <textarea id="sysPrompt" style="flex:1; height:75px; font-size:12px; line-height:1.4;"></textarea>
  </div>

  <div class="panel-row">
    <label>語音朗讀:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 回覆自動朗讀</label>
    <span style="margin-left:8px;">語速:</span>
    <input id="ttsRate" type="range" min="0.5" max="2.0" step="0.1" value="1.0" oninput="rateVal.innerText=this.value" style="width:60px;" />
    <span id="rateVal">1.0</span>x
    <select id="voiceSelect" style="max-width:160px;"><option value="">讀取語音中...</option></select>
  </div>

  <div class="panel-row">
    <label>持久常駐檔案:</label>
    <input type="file" id="fileInput" accept=".txt,.md,.json,.csv" />
    <span id="fileMemoryInfo" style="color:var(--muted); font-size:11px;">尚未綁定資料</span>
  </div>
</section>

<main id="chat-box"></main>

<footer>
  <div class="control-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="btn btn-active" id="webSearchToggle" onclick="toggleWebSearch()" title="開啟後聯網驗證">🌐 查核導入: 開啟</button>
      <span style="color:var(--muted);">思考複雜度:</span>
      <select id="complexitySelect" style="background:#070a12; color:#60a5fa; font-weight:600; padding:2px 6px;">
        <option value="auto">✨ 自動路由</option>
        <option value="fast">⚡ 極速秒回</option>
        <option value="deep">🔬 深度推導</option>
      </select>
    </div>
    <!-- 獨立清除對話歷史，完全不影響 API Key、人設與其他配置 -->
    <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="clearAllChat()">🧹 單獨清空對話記錄</button>
  </div>
  <div class="input-bar">
    <div class="mic-button-container">
      <button class="icon-btn" id="micBtn" title="手動開關麥克風 (點擊啟動/關閉)" onclick="toggleVoice()">
        🎙️
        <div class="mic-indicator-led" id="micLed" title="紅色: 關閉 | 綠色: 錄音使用中"></div>
      </button>
    </div>
    <!-- 防側錄防護配置：關閉瀏覽器快取、拼寫推薦與歷史記住 -->
    <textarea id="userInput" placeholder="輸入問題或消息 (Enter 發送, Shift+Enter 換行)..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
</footer>

<script>
  // ================= 1. 防劫持、防竄改與防點擊劫持 (Frame-Busting & Anti-Tamper) =================
  (function initSecurityShield() {
    // 防點擊劫持：若被嵌入外部 iframe，強制跳出還原
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }
    // 凍結關鍵原型，防範惡意腳本竄改 fetch 竊取封包
    try {
      Object.freeze(Object.prototype);
      Object.freeze(Array.prototype);
    } catch (e) {}
  })();

  (function() {
    let conversation = [];
    let permanentContext = "";
    let memoryKey = "";
    let availableChatModels = [];
    let isWebSearchEnabled = true;

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const keyIndicator = document.getElementById("key-indicator");
    const keyMsg = document.getElementById("key-msg");
    const complexitySelect = document.getElementById("complexitySelect");
    const webSearchToggle = document.getElementById("webSearchToggle");
    const sysPrompt = document.getElementById("sysPrompt");
    const presetPromptSelect = document.getElementById("presetPromptSelect");
    const autoSpeakCheck = document.getElementById("autoSpeakCheck");
    const ttsRate = document.getElementById("ttsRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const fileMemoryInfo = document.getElementById("fileMemoryInfo");
    const micBtn = document.getElementById("micBtn");
    const micLed = document.getElementById("micLed");

    const PRESETS = {
      fact_checker: `你是一位客觀、嚴謹的中立事實查核與資訊彙整專家。
當用戶提供消息或查詢特定議題時：
1. 優先依據所導入之客觀第三方驗證資料進行核對。
2. 輸出時使用通順、符合台灣習慣的繁體中文，消除生硬機翻痕跡，文法流暢且邏輯嚴謹。
3. 區分「已知事實」、「各方說法」與「未經證實之傳聞」，明確標註客觀出處。`,
      research_analyst: `你是一位資深政策與產業研究分析師。請以嚴謹的學術與邏輯推導架構深入剖析，梳理因果脈絡，保持繁體中文結構分明、要點清晰。`,
      custom: `你是一位具備高度同理心與嚴謹思維的繁體中文 AI 專家助手。`
    };

    function applyPresetPrompt() {
      const selected = presetPromptSelect.value;
      sysPrompt.value = PRESETS[selected] || PRESETS.custom;
      localStorage.setItem("saved_sys_prompt", sysPrompt.value);
    }
    window.applyPresetPrompt = applyPresetPrompt;

    if (localStorage.getItem("saved_sys_prompt")) {
      sysPrompt.value = localStorage.getItem("saved_sys_prompt");
    } else {
      applyPresetPrompt();
    }
    sysPrompt.addEventListener("change", () => {
      localStorage.setItem("saved_sys_prompt", sysPrompt.value);
    });

    window.toggleWebSearch = function() {
      isWebSearchEnabled = !isWebSearchEnabled;
      webSearchToggle.classList.toggle("btn-active", isWebSearchEnabled);
      webSearchToggle.innerText = isWebSearchEnabled ? "🌐 查核導入: 開啟" : "🌐 查核導入: 關閉";
    };

    // ================= 2. API Key 持久免重輸管理（更新不遺失） =================
    function initKeyStorage() {
      // 優先從本地隔離庫讀取已儲存的金鑰
      const storedKey = localStorage.getItem("app_vault_key");
      if (storedKey) {
        apiKeyInput.value = storedKey;
        memoryKey = storedKey;
        validateAndLoadModels(storedKey, false);
      }
    }

    async function validateAndSaveAPIKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        keyIndicator.style.background = "#64748b";
        keyIndicator.innerText = "未填入金鑰";
        keyMsg.innerText = "";
        localStorage.removeItem("app_vault_key");
        memoryKey = "";
        return false;
      }
      return await validateAndLoadModels(key, true);
    }
    window.validateAndSaveAPIKey = validateAndSaveAPIKey;

    async function validateAndLoadModels(key, showFeedback = true) {
      if (showFeedback) {
        keyIndicator.style.background = "#eab308";
        keyIndicator.innerText = "驗證中...";
      }
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": "Bearer " + key }
        });
        if (res.ok) {
          const data = await res.json();
          availableChatModels = (data.data || []).map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("distil"));
          keyIndicator.style.background = "var(--safe)";
          keyIndicator.innerText = "🟢 金鑰就緒";
          if (showFeedback) {
            keyMsg.style.color = "var(--safe)";
            keyMsg.innerText = "驗證通過，已持久記憶";
          }
          memoryKey = key;
          // 持久寫入，更新代碼或刷新頁面永不遺失
          localStorage.setItem("app_vault_key", key);
          return true;
        } else {
          keyIndicator.style.background = "var(--danger)";
          keyIndicator.innerText = "🔴 金鑰無效";
          if (showFeedback) {
            keyMsg.style.color = "var(--danger)";
            keyMsg.innerText = "API Key 錯誤";
          }
          return false;
        }
      } catch (e) {
        keyIndicator.style.background = "var(--danger)";
        keyIndicator.innerText = "連線失敗";
        return false;
      }
    }

    function resolveModel(promptText) {
      if (availableChatModels.length === 0) return "llama-3.3-70b-versatile";
      const deepCandidates = ["llama-3.3-70b-versatile", "llama-3.1-70b-versatile", "openai/gpt-oss-120b", "qwen/qwen3.8-27b"];
      const fastCandidates = ["llama-3.1-8b-instant", "llama3-8b-8192", "gemma2-9b-it", "openai/gpt-oss-20b"];
      const bestDeep = deepCandidates.find(c => availableChatModels.includes(c)) || availableChatModels[0];
      const bestFast = fastCandidates.find(c => availableChatModels.includes(c)) || availableChatModels[availableChatModels.length - 1];

      const mode = complexitySelect.value;
      if (mode === "fast") return bestFast;
      if (mode === "deep") return bestDeep;
      return (promptText.length > 40 || /(查核|真偽|來源|邏輯|分析|研究)/i.test(promptText)) ? bestDeep : bestFast;
    }

    // ================= 3. 麥克風硬體狀態燈（純用戶端手動觸發） =================
    let recognition = null;
    let isMicRecording = false;

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = "zh-TW";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        let finalStr = "";
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            finalStr += e.results[i][0].transcript;
          }
        }
        if (finalStr) userInput.value += finalStr;
      };

      recognition.onerror = () => stopMicByUser();
      recognition.onend = () => {
        // 嚴格限制：僅由用戶端主動控制，非用戶手動觸發時絕不自動重啟
        stopMicByUser();
      };
    }

    function startMicByUser() {
      if (!recognition) {
        alert("瀏覽器不支援語音輸入，請使用 Safari 或 Chrome。");
        return;
      }
      try {
        recognition.start();
        isMicRecording = true;
        micBtn.classList.add("mic-active");
        micLed.title = "綠色: 正在錄音使用中";
      } catch (e) {}
    }

    function stopMicByUser() {
      if (recognition && isMicRecording) {
        recognition.stop();
      }
      isMicRecording = false;
      micBtn.classList.remove("mic-active");
      micLed.title = "紅色: 已關閉";
    }

    // 強制僅能由用戶點擊按鈕切換
    window.toggleVoice = function() {
      if (isMicRecording) {
        stopMicByUser();
      } else {
        startMicByUser();
      }
    };

    // ================= 4. 背景公信數據查核 =================
    async function fetchFactContext(query) {
      if (!isWebSearchEnabled) return "";
      let collectedData = "";
      try {
        const cleanQuery = query.replace(/[?？!！,，。]/g, " ").trim().slice(0, 30);
        const wikiUrl = `https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`;
        const wikiRes = await fetch(wikiUrl);
        if (wikiRes.ok) {
          const wikiData = await wikiRes.json();
          if (wikiData.extract) {
            collectedData += `【官方百科背景條目 (${wikiData.title})】：\n${wikiData.extract}\n\n`;
          }
        }
      } catch (e) {}

      try {
        const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
        const ddgRes = await fetch(ddgUrl);
        if (ddgRes.ok) {
          const ddgData = await ddgRes.json();
          if (ddgData.AbstractText) {
            collectedData += `【第三方公信資料庫摘要】：\n${ddgData.AbstractText}\n來源: ${ddgData.AbstractSource || '公開文獻'}\n\n`;
          }
        }
      } catch (e) {}

      return collectedData.trim();
    }

    // ================= 5. 訊息渲染與單獨清除歷史 =================
    function appendMessage(role, text, index) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.index = index;

      const textSpan = document.createElement("div");
      textSpan.className = "bubble-text";
      textSpan.textContent = text;
      div.appendChild(textSpan);

      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      if (role === "assistant") {
        const spkBtn = document.createElement("button");
        spkBtn.className = "tool-btn";
        spkBtn.textContent = "🔊 朗讀";
        spkBtn.onclick = () => speakText(textSpan.textContent);
        tools.appendChild(spkBtn);
      }

      const editBtn = document.createElement("button");
      editBtn.className = "tool-btn";
      editBtn.textContent = "✏️ 編輯";
      editBtn.onclick = () => editMessage(index);
      tools.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "tool-btn";
      delBtn.textContent = "🗑️ 刪除";
      delBtn.onclick = () => deleteMessage(index);
      tools.appendChild(delBtn);

      div.appendChild(tools);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { bubble: div, textSpan };
    }

    function renderAllMessages() {
      chatBox.textContent = "";
      conversation.forEach((msg, idx) => {
        appendMessage(msg.role, msg.content, idx);
      });
    }

    function editMessage(index) {
      const current = conversation[index].content;
      const updated = prompt("編輯該條對話內容：", current);
      if (updated !== null && updated.trim() !== "") {
        conversation[index].content = updated.trim();
        renderAllMessages();
      }
    }

    function deleteMessage(index) {
      if (confirm("確定刪除此條對話記錄？")) {
        conversation.splice(index, 1);
        renderAllMessages();
      }
    }

    // 單獨清空對話紀錄，完全不影響金鑰、模型與其他配置
    window.clearAllChat = function() {
      if (confirm("確定清空目前畫面的所有對話歷史？（您的 API Key 與所有系統設定將完好保留）")) {
        conversation = [];
        chatBox.textContent = "";
      }
    };

    // 徹底抹除（銷毀金鑰與所有本機記憶）
    window.destroyAllMemory = function() {
      if (!confirm("確定要抹除全部資料、對話、儲存的 API Key 與常駐卷宗嗎？此操作不可逆！")) return;
      conversation = []; permanentContext = ""; memoryKey = ""; apiKeyInput.value = "";
      localStorage.clear(); sessionStorage.clear(); chatBox.textContent = "";
      keyIndicator.style.background = "#64748b";
      keyIndicator.innerText = "已徹底銷毀";
      keyMsg.innerText = "";
      stopMicByUser();
      if (window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      alert("所有數據已徹底自本機抹除。");
    };

    // ================= 6. 訊息傳送與打字機輸出 =================
    window.sendMessage = async function() {
      const rawText = userInput.value.trim();
      const key = memoryKey || apiKeyInput.value.trim();
      if (!rawText) return;
      if (!key) { alert("請在配置中填入有效的 Groq API Key！"); return; }

      // 若使用者仍在錄音，發送前關閉麥克風
      stopMicByUser();

      const userIdx = conversation.length;
      conversation.push({ role: "user", content: rawText });
      appendMessage("user", rawText, userIdx);
      userInput.value = "";

      const aiIdx = conversation.length;
      const aiMsg = appendMessage("assistant", "", aiIdx);
      aiMsg.textSpan.textContent = "▍";

      let factContext = "";
      if (isWebSearchEnabled) {
        aiMsg.textSpan.textContent = "🔍 背景比對公信資料庫...";
        factContext = await fetchFactContext(rawText);
      }

      let fullSystemPrompt = sysPrompt.value;
      if (permanentContext) fullSystemPrompt += "\n\n【常駐背景資料】：\n" + permanentContext;
      if (factContext) {
        fullSystemPrompt += "\n\n【第三方公信數據】：\n" + factContext + "\n※ 請依上述客觀資料進行嚴謹論證並標註來源。";
      }

      const payloadMessages = [{ role: "system", content: fullSystemPrompt }, ...conversation.slice(-12)];
      const chosenModel = resolveModel(rawText);

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: chosenModel, messages: payloadMessages, stream: true })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || ("伺服器錯誤狀態: " + response.status));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                const token = parsed.choices[0].delta?.content || "";
                fullReply += token;
                buffer += token;
                if (buffer.length >= 3) {
                  aiMsg.textSpan.textContent = fullReply + "▍";
                  chatBox.scrollTop = chatBox.scrollHeight;
                  buffer = "";
                }
              } catch (e) {}
            }
          }
        }

        aiMsg.textSpan.textContent = fullReply;
        conversation.push({ role: "assistant", content: fullReply });
        renderAllMessages();

        if (autoSpeakCheck.checked) speakText(fullReply);

      } catch (err) {
        aiMsg.textSpan.textContent = "出錯了: " + err.message;
        conversation.pop();
      }
    };

    // ================= 7. 語音合成 (TTS) =================
    let synth = window.speechSynthesis;
    let voices = [];
    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices();
      voiceSelect.textContent = "";
      const zhVoices = voices.filter(v => v.lang.includes("zh") || v.lang.includes("cmn"));
      (zhVoices.length > 0 ? zhVoices : voices).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speakText(text) {
      if (!synth || !text) return;
      if (synth.speaking) synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = parseFloat(ttsRate.value);
      const selected = voices.find(v => v.name === voiceSelect.value);
      if (selected) utter.voice = selected;
      else utter.lang = "zh-TW";

      synth.speak(utter);
    }

    // ================= 8. 更新檢查（保持金鑰狀態） =================
    window.checkCodeUpdate = async function() {
      try {
        const currentUrl = window.location.href.split('?')[0];
        const res = await fetch(`${currentUrl}?_t=${Date.now()}`, { cache: "no-store" });
        if (res.ok && confirm("已與伺服器完成最新版本通訊！是否立即無快取重新載入？（您的 API Key 與設定將被完好保留）")) {
          window.location.reload(true);
        }
      } catch (e) { alert("檢查失敗，請確認網路連線。"); }
    };

    window.toggleSettings = function() {
      const p = document.getElementById("settings-panel");
      p.style.display = (p.style.display === "flex") ? "none" : "flex";
    };

    document.getElementById("fileInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        permanentContext = evt.target.result.slice(0, 10000);
        fileMemoryInfo.textContent = `已鎖定：${file.name} (${permanentContext.length} 字)`;
        alert(`文件「${file.name}」已寫入記憶！`);
      };
      reader.readAsText(file);
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        window.sendMessage();
      }
    });

    // 啟動初始化持久金鑰
    initKeyStorage();
  })();
</script>
</body>
</html>
