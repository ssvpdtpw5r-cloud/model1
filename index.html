<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>即時直覺推理終端</title>
  <style>
    :root {
      --bg: #070a12;
      --card: #0f1626;
      --panel: #0a101d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #2563eb;
      --user: #1d4ed8;
      --ai: #131d31;
      --border: #1e293b;
      --danger: #ef4444;
      --safe: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
    header {
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--safe);
      color: #fff;
    }
    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { background: #1a253a; border-color: var(--accent); }
    .danger-btn { border-color: var(--danger); color: #fca5a5; }

    #settings-panel {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      gap: 10px;
      flex-direction: column;
      font-size: 13px;
      max-height: 55vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .panel-row label { min-width: 85px; color: var(--muted); }
    input, select, textarea, button {
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #070a12;
      color: var(--text);
      padding: 6px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      contain: layout;
    }
    .bubble {
      max-width: 88%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .user { align-self: flex-end; background: var(--user); color: #fff; }
    .assistant { 
      align-self: flex-start; 
      background: var(--ai); 
      color: #e2e8f0; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .bubble-tools {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tool-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

    footer {
      padding: 10px 14px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    textarea { 
      flex: 1; 
      resize: none; 
      height: 46px; 
      line-height: 22px; 
      padding: 10px 12px; 
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0 18px;
      height: 46px;
      white-space: nowrap;
    }
    .mic-button-container {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 8px;
      position: relative;
    }
    .mic-indicator-led {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
      pointer-events: none;
    }
    .mic-active .mic-indicator-led {
      background: var(--safe);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
      animation: pulse-led 1s infinite;
    }
    .mic-active {
      border-color: var(--safe) !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }
    @keyframes pulse-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong style="color:#60a5fa;">即時直覺推理終端</strong>
    <span id="key-indicator" class="status-badge" style="background:#64748b;">檢測中...</span>
  </div>
  <div style="display:flex; gap:6px;">
    <button class="btn" onclick="checkCodeUpdate()">🔄 檢查更新</button>
    <button class="btn" onclick="toggleSettings()">⚙️ 終端配置</button>
    <button class="btn danger-btn" onclick="destroyAllMemory()">銷毀記錄</button>
  </div>
</header>

<section id="settings-panel">
  <div class="panel-row">
    <label>Groq Key:</label>
    <input id="apiKey" type="password" placeholder="貼上 gsk_... 金鑰 (自動記憶不遺失)" style="flex:1; min-width:180px;" onchange="validateAndSaveAPIKey()" autocomplete="off" />
    <button class="btn" onclick="validateAndSaveAPIKey()">測試並保存</button>
    <span id="key-msg" style="font-size:12px;"></span>
  </div>

  <div class="panel-row">
    <label style="color:#60a5fa;">直覺人設:</label>
    <textarea id="sysPrompt" style="flex:1; height:65px; font-size:12px; line-height:1.4;">你是一位具備頂尖敏銳度與即時綜合判斷力的專業助理。回答時直奔核心、邏輯嚴密，嚴禁給出「我無法取得」、「資料庫截止於」等任何免責宣告。一律直接針對當前時局與問題核心展開深層分析與具體說明。</textarea>
  </div>

  <div class="panel-row">
    <label>語音朗讀:</label>
    <label style="min-width:auto;"><input type="checkbox" id="autoSpeakCheck" /> 回覆自動朗讀</label>
    <span style="margin-left:8px;">語速:</span>
    <input id="ttsRate" type="range" min="0.5" max="2.0" step="0.1" value="1.0" oninput="rateVal.innerText=this.value" style="width:60px;" />
    <span id="rateVal">1.0</span>x
    <select id="voiceSelect" style="max-width:160px;"><option value="">讀取語音中...</option></select>
  </div>
</section>

<main id="chat-box"></main>

<footer>
  <div class="control-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="color:#60a5fa; font-weight:600;">⚡ 直覺即時模式：已啟用</span>
      <span style="color:var(--muted);">推理力度:</span>
      <select id="complexitySelect" style="background:#070a12; color:#60a5fa; font-weight:600; padding:2px 6px;">
        <option value="deep" selected>🔬 深度推理分析 (70B)</option>
        <option value="fast">⚡ 極速即時直出 (8B)</option>
      </select>
    </div>
    <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="clearAllChat()">🧹 單獨清空對話記錄</button>
  </div>
  <div class="input-bar">
    <div class="mic-button-container">
      <button class="icon-btn" id="micBtn" title="手動開關麥克風 (點擊啟動/關閉)" onclick="toggleVoice()">
        🎙️
        <div class="mic-indicator-led" id="micLed" title="紅色: 關閉 | 綠色: 錄音中"></div>
      </button>
    </div>
    <textarea id="userInput" placeholder="直接輸入任何問題或事件分析... (Enter 發送, Shift+Enter 換行)" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">發送</button>
  </div>
</footer>

<script>
  (function() {
    let conversation = [];
    let memoryKey = "";
    let availableChatModels = [];

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("userInput");
    const apiKeyInput = document.getElementById("apiKey");
    const keyIndicator = document.getElementById("key-indicator");
    const keyMsg = document.getElementById("key-msg");
    const complexitySelect = document.getElementById("complexitySelect");
    const sysPrompt = document.getElementById("sysPrompt");
    const autoSpeakCheck = document.getElementById("autoSpeakCheck");
    const ttsRate = document.getElementById("ttsRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const micBtn = document.getElementById("micBtn");
    const micLed = document.getElementById("micLed");

    if (localStorage.getItem("saved_intuitive_prompt")) {
      sysPrompt.value = localStorage.getItem("saved_intuitive_prompt");
    }
    sysPrompt.addEventListener("change", () => {
      localStorage.setItem("saved_intuitive_prompt", sysPrompt.value);
    });

    // ================= 1. API Key 持久化保存 =================
    function initKeyStorage() {
      const storedKey = localStorage.getItem("app_vault_key");
      if (storedKey) {
        apiKeyInput.value = storedKey;
        memoryKey = storedKey;
        validateAndLoadModels(storedKey, false);
      }
    }

    async function validateAndSaveAPIKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        keyIndicator.style.background = "#64748b";
        keyIndicator.innerText = "未填入金鑰";
        keyMsg.innerText = "";
        localStorage.removeItem("app_vault_key");
        memoryKey = "";
        return false;
      }
      return await validateAndLoadModels(key, true);
    }
    window.validateAndSaveAPIKey = validateAndSaveAPIKey;

    async function validateAndLoadModels(key, showFeedback = true) {
      if (showFeedback) {
        keyIndicator.style.background = "#eab308";
        keyIndicator.innerText = "驗證中...";
      }
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": "Bearer " + key }
        });
        if (res.ok) {
          const data = await res.json();
          availableChatModels = (data.data || []).map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("distil"));
          keyIndicator.style.background = "var(--safe)";
          keyIndicator.innerText = "🟢 金鑰就緒";
          if (showFeedback) {
            keyMsg.style.color = "var(--safe)";
            keyMsg.innerText = "驗證通過，已持久記憶";
          }
          memoryKey = key;
          localStorage.setItem("app_vault_key", key);
          return true;
        } else {
          keyIndicator.style.background = "var(--danger)";
          keyIndicator.innerText = "🔴 金鑰無效";
          return false;
        }
      } catch (e) {
        keyIndicator.style.background = "var(--danger)";
        keyIndicator.innerText = "連線失敗";
        return false;
      }
    }

    function resolveModel() {
      if (availableChatModels.length === 0) return "llama-3.3-70b-versatile";
      const deepCandidates = ["llama-3.3-70b-versatile", "llama-3.1-70b-versatile", "openai/gpt-oss-120b", "qwen/qwen3.8-27b"];
      const fastCandidates = ["llama-3.1-8b-instant", "llama3-8b-8192", "gemma2-9b-it", "openai/gpt-oss-20b"];
      const bestDeep = deepCandidates.find(c => availableChatModels.includes(c)) || availableChatModels[0];
      const bestFast = fastCandidates.find(c => availableChatModels.includes(c)) || availableChatModels[availableChatModels.length - 1];

      return complexitySelect.value === "fast" ? bestFast : bestDeep;
    }

    // ================= 2. 麥克風純用戶端手動觸發 =================
    let recognition = null;
    let isMicRecording = false;

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = "zh-TW";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        let finalStr = "";
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) finalStr += e.results[i][0].transcript;
        }
        if (finalStr) userInput.value += finalStr;
      };

      recognition.onerror = () => stopMicByUser();
      recognition.onend = () => stopMicByUser();
    }

    function startMicByUser() {
      if (!recognition) { alert("瀏覽器不支援語音輸入"); return; }
      try {
        recognition.start();
        isMicRecording = true;
        micBtn.classList.add("mic-active");
      } catch (e) {}
    }

    function stopMicByUser() {
      if (recognition && isMicRecording) recognition.stop();
      isMicRecording = false;
      micBtn.classList.remove("mic-active");
    }

    window.toggleVoice = function() {
      if (isMicRecording) stopMicByUser();
      else startMicByUser();
    };

    // ================= 3. 訊息渲染與發送 =================
    function appendMessage(role, text, index) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.dataset.index = index;

      const textSpan = document.createElement("div");
      textSpan.className = "bubble-text";
      textSpan.textContent = text;
      div.appendChild(textSpan);

      const tools = document.createElement("div");
      tools.className = "bubble-tools";

      if (role === "assistant") {
        const spkBtn = document.createElement("button");
        spkBtn.className = "tool-btn";
        spkBtn.textContent = "🔊 朗讀";
        spkBtn.onclick = () => speakText(textSpan.textContent);
        tools.appendChild(spkBtn);
      }

      const editBtn = document.createElement("button");
      editBtn.className = "tool-btn";
      editBtn.textContent = "✏️ 編輯";
      editBtn.onclick = () => editMessage(index);
      tools.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "tool-btn";
      delBtn.textContent = "🗑️ 刪除";
      delBtn.onclick = () => deleteMessage(index);
      tools.appendChild(delBtn);

      div.appendChild(tools);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { bubble: div, textSpan };
    }

    function renderAllMessages() {
      chatBox.textContent = "";
      conversation.forEach((msg, idx) => {
        appendMessage(msg.role, msg.content, idx);
      });
    }

    function editMessage(index) {
      const current = conversation[index].content;
      const updated = prompt("編輯該條對話內容：", current);
      if (updated !== null && updated.trim() !== "") {
        conversation[index].content = updated.trim();
        renderAllMessages();
      }
    }

    function deleteMessage(index) {
      if (confirm("確定刪除此條記錄？")) {
        conversation.splice(index, 1);
        renderAllMessages();
      }
    }

    window.clearAllChat = function() {
      if (confirm("確定清空目前畫面的所有對話歷史？（金鑰與設定將完好保留）")) {
        conversation = [];
        chatBox.textContent = "";
      }
    };

    window.destroyAllMemory = function() {
      if (!confirm("確定要徹底抹除全部資料、對話、儲存的金鑰嗎？此操作不可逆！")) return;
      conversation = []; memoryKey = ""; apiKeyInput.value = "";
      localStorage.clear(); sessionStorage.clear(); chatBox.textContent = "";
      keyIndicator.style.background = "#64748b";
      keyIndicator.innerText = "已徹底銷毀";
      keyMsg.innerText = "";
      stopMicByUser();
      if (window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      alert("所有數據已徹底銷毀。");
    };

    // ================= 4. 直覺即時發送核心 =================
    window.sendMessage = async function() {
      const rawText = userInput.value.trim();
      const key = memoryKey || apiKeyInput.value.trim();
      if (!rawText) return;
      if (!key) { alert("請在配置中填入有效的 Groq API Key！"); return; }

      stopMicByUser();

      const userIdx = conversation.length;
      conversation.push({ role: "user", content: rawText });
      appendMessage("user", rawText, userIdx);
      userInput.value = "";

      const aiIdx = conversation.length;
      const aiMsg = appendMessage("assistant", "", aiIdx);
      aiMsg.textSpan.textContent = "▍";

      // 動態注入當前本地精準時空標籤，終止一切時間截斷的推託機制
      const now = new Date();
      const dateString = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const timeContext = `【當前時空坐標】：今天是 ${dateString}。使用者所在區域為台灣。請以具備前瞻邏輯與敏銳時事洞察的視角，直接回答問題核心。`;

      let fullSystemPrompt = `${sysPrompt.value}\n\n${timeContext}\n\n【絕對執行指示】：\n1. 絕對禁止輸出「我無法取得即時資訊」、「知識庫截止於」或任何網站/媒體清單。\n2. 當詢問新聞、時事、脈動或政策時，依據深層邏輯推導與已知大勢，直接條列呈現關鍵事件分析、核心焦點與深入剖析，以流暢優雅的繁體中文直出內容。`;

      const payloadMessages = [{ role: "system", content: fullSystemPrompt }, ...conversation.slice(-10)];
      const chosenModel = resolveModel();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model: chosenModel, messages: payloadMessages, stream: true })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || ("狀態碼: " + response.status));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(line.slice(6));
                const token = parsed.choices[0].delta?.content || "";
                fullReply += token;
                buffer += token;
                if (buffer.length >= 2) {
                  aiMsg.textSpan.textContent = fullReply + "▍";
                  chatBox.scrollTop = chatBox.scrollHeight;
                  buffer = "";
                }
              } catch (e) {}
            }
          }
        }

        aiMsg.textSpan.textContent = fullReply;
        conversation.push({ role: "assistant", content: fullReply });
        renderAllMessages();

        if (autoSpeakCheck.checked) speakText(fullReply);

      } catch (err) {
        aiMsg.textSpan.textContent = "出錯了: " + err.message;
        conversation.pop();
      }
    };

    // ================= 5. TTS 朗讀 =================
    let synth = window.speechSynthesis;
    let voices = [];
    function loadVoices() {
      if (!synth) return;
      voices = synth.getVoices();
      voiceSelect.textContent = "";
      const zhVoices = voices.filter(v => v.lang.includes("zh") || v.lang.includes("cmn"));
      (zhVoices.length > 0 ? zhVoices : voices).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speakText(text) {
      if (!synth || !text) return;
      if (synth.speaking) synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = parseFloat(ttsRate.value);
      const selected = voices.find(v => v.name === voiceSelect.value);
      if (selected) utter.voice = selected;
      else utter.lang = "zh-TW";
      synth.speak(utter);
    }

    // ================= 6. 更新與配置開合 =================
    window.checkCodeUpdate = async function() {
      try {
        const currentUrl = window.location.href.split('?')[0];
        const res = await fetch(`${currentUrl}?_t=${Date.now()}`, { cache: "no-store" });
        if (res.ok && confirm("已連線確認！是否立即重新載入最新版本？（金鑰與設定將完好保留）")) {
          window.location.reload(true);
        }
      } catch (e) { alert("檢查失敗，請確認網路連線。"); }
    };

    window.toggleSettings = function() {
      const p = document.getElementById("settings-panel");
      p.style.display = (p.style.display === "flex") ? "none" : "flex";
    };

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        window.sendMessage();
      }
    });

    initKeyStorage();
  })();
</script>
